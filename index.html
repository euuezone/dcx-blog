<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCX 김효주</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fff;
  --text: #0a0a0a;
  --sub: #6e7787;
  --border: #e8eaec;
  --accent: #0052ff;
  --accent-bg: #eef3ff;
  --hover-bg: #f7f8f9;
  --radius: 12px;
}

body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
}
.logo-mark {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.03em;
}
nav { display: flex; gap: 4px; }
nav a {
  padding: 6px 14px;
  font-size: 14px;
  color: var(--sub);
  text-decoration: none;
  border-radius: 8px;
  transition: all 0.15s;
  font-weight: 500;
}
nav a:hover { background: var(--hover-bg); color: var(--text); }
nav a.active { color: var(--text); font-weight: 600; }

/* ── Layout ── */
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── Hero ── */
.hero {
  padding: 72px 0 56px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 20px;
}
.hero-eyebrow::before {
  content: '';
  width: 20px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}
.hero h1 {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 20px;
}
.hero h1 em {
  font-style: normal;
  color: var(--accent);
}
.hero-desc {
  font-size: 16px;
  color: var(--sub);
  max-width: 440px;
  line-height: 1.7;
}

/* ── Projects strip ── */
.projects-wrap {
  padding: 28px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 56px;
}
.projects-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sub);
  margin-bottom: 14px;
}
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.project-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  text-decoration: none;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.project-card:hover { border-color: var(--accent); background: var(--accent-bg); }
.project-card-head {
  display: flex;
  align-items: center;
  gap: 7px;
}
.project-card-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.project-card-ver {
  font-size: 11px;
  color: var(--sub);
  margin-left: auto;
  opacity: 0.7;
}
.project-card-desc {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.55;
}
.project-card-guide {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 4px 10px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.project-card-guide:hover { background: #d6e4ff; }
.pill-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

/* ── Blog section ── */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
}
.section-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.post-count {
  font-size: 14px;
  color: var(--sub);
  margin-left: 8px;
  font-weight: 400;
}

/* Filter tabs */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  color: var(--sub);
  background: none;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  font-weight: 500;
}
.filter-btn.on {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}
.filter-btn:not(.on):hover {
  background: var(--hover-bg);
  color: var(--text);
}

/* Posts grid */
.posts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.post-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  flex-direction: column;
}
.post-card:hover {
  border-color: #c8d8ff;
  box-shadow: 0 8px 32px rgba(0,82,255,0.07);
  transform: translateY(-2px);
}
.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.category-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 3px 10px;
  border-radius: 100px;
}
.cat-삽질기 { background: #fff0f0; color: #e53e3e; }
.cat-해결기 { background: #f0fdf4; color: #16a34a; }
.cat-발견   { background: #fdf4ff; color: #9333ea; }
.cat-작업일지 { background: var(--accent-bg); color: var(--accent); }
.cat-프로젝트소개 { background: #fff7ed; color: #ea580c; }

.card-date { font-size: 12px; color: var(--sub); margin-left: auto; }
.card-project { font-size: 12px; color: var(--sub); }

.card-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  flex: 1;
}
.card-summary {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.card-tag {
  font-size: 11px;
  color: var(--sub);
  background: var(--hover-bg);
  padding: 2px 8px;
  border-radius: 4px;
}

/* Empty */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 0;
  color: var(--sub);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }

/* ── Modal ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.5);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 24px;
  z-index: 1000;
  overflow-y: auto;
}
.overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 16px;
  max-width: 720px;
  width: 100%;
  padding: 52px 52px 60px;
  position: relative;
  margin: auto;
}
.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border: none;
  background: var(--hover-bg);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: var(--border); }
.modal-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 4px 12px;
  border-radius: 100px;
  display: inline-block;
  margin-bottom: 20px;
}
.modal-title {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.025em;
  margin-bottom: 14px;
}
.modal-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--sub);
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.meta-dot { color: var(--border); }
.meta-tag {
  background: var(--hover-bg);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
}

/* Modal content typography */
.modal-body { font-size: 15px; color: #333; line-height: 1.85; }
.modal-body h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-top: 36px;
  margin-bottom: 12px;
  color: var(--text);
}
.modal-body p { margin-bottom: 14px; }
.modal-body ul { padding-left: 20px; margin-bottom: 14px; }
.modal-body li { margin-bottom: 6px; color: var(--sub); }
.modal-body code {
  font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  font-size: 13px;
  background: #f3f4f6;
  padding: 2px 6px;
  border-radius: 4px;
  color: #d6336c;
}
.modal-body pre {
  background: #0f1117;
  color: #e2e8f0;
  padding: 20px 24px;
  border-radius: 10px;
  font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  font-size: 13px;
  line-height: 1.7;
  overflow-x: auto;
  margin: 16px 0;
}
.modal-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
.modal-body a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  border-bottom: 1px solid var(--accent);
  transition: opacity 0.15s;
}
.modal-body a:hover { opacity: 0.7; }
.modal-body .report-link {
  display: inline-block;
  margin-top: 24px;
  padding: 10px 20px;
  background: var(--accent);
  color: #fff !important;
  border: none !important;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.modal-body .report-link:hover { opacity: 0.85; }

.modal-body .callout {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 0 8px 8px 0;
  margin: 20px 0;
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  line-height: 1.6;
}

/* ── Share button (modal) ── */
.modal-share {
  position: absolute;
  top: 20px;
  right: 64px;
  width: 36px;
  height: 36px;
  border: none;
  background: var(--hover-bg);
  border-radius: 8px;
  cursor: pointer;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.modal-share:hover { background: var(--border); color: var(--text); }

/* ── Share button (card hover) ── */
.post-card { position: relative; }
.card-share {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px;
  height: 28px;
  border: none;
  background: var(--border);
  border-radius: 6px;
  cursor: pointer;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
  z-index: 2;
}
.post-card:hover .card-share { opacity: 1; }
.card-share:hover { background: var(--accent); color: #fff; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #0a0a0a;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Download button ── */
.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  margin: 20px 0 8px;
  transition: background 0.15s;
}
.download-btn:hover { background: #0041cc; }
.download-note { font-size: 12px; color: var(--sub); margin-bottom: 20px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .posts-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .posts-grid { grid-template-columns: 1fr; }
  .modal { padding: 36px 24px 48px; }
  .modal-title { font-size: 22px; }
  nav a span { display: none; }
  .hero h1 { font-size: 28px; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="header-inner">
    <a href="#" class="logo">
      DCX
    </a>
    <nav>
      <a href="#posts" class="active">기록</a>
      <a href="#projects">프로젝트</a>
    </nav>
  </div>
</header>

<main>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-eyebrow">작업 기록 by DCX 김효주</div>
    <h1>지금,<br><em>해결 중</em></h1>
    <p class="hero-desc">AI 서비스를 만들면서 마주친 것들을 기록합니다.<br>삽질, 발견, 깨달음 — 잊기 전에 남겨두기.</p>
  </section>

  <!-- Projects strip -->
  <div class="projects-wrap" id="projects">
    <div class="projects-label">운영중인 프로젝트</div>
    <div class="projects-grid" id="projectsList"></div>
  </div>

  <!-- Posts -->
  <section id="posts">
    <div class="section-head">
      <div>
        <span class="section-title">기록</span>
        <span class="post-count" id="postCount"></span>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
  </section>

</main>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalInner"></div>
  </div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
// build-blog.py 가 이 블록을 자동으로 업데이트함
const BLOG_DATA = {
  "posts": [
    {
      "id": "intro_shinhan-dashboard",
      "title": "TC 대시보드 — 프로젝트 소개 및 사용 안내",
      "date": "2026-04-01",
      "category": "프로젝트소개",
      "tags": ["TC대시보드", "대시보드", "GitHub Pages"],
      "project": "TC_대시보드",
      "summary": "투자증권 차세대 프로젝트의 전체 작업 현황을 한 화면에서 확인할 수 있는 웹 대시보드입니다. 별도 설치 없이 링크 접속만으로 이용 가능합니다.",
      "content": "<h2>프로젝트 개요</h2><p>투자증권 차세대 프로젝트는 기획, 디자인, 개발, QA 등 여러 직군이 동시에 작업하는 대규모 프로젝트입니다. 수백 개의 화면이 병렬로 진행되는 환경에서, 각 화면의 진행 상태를 실시간으로 파악하고 팀 간 정보를 공유할 수 있는 수단이 필요했습니다.</p><p>TC 대시보드는 이러한 요구를 충족하기 위해 제작된 웹 기반 작업 현황 시각화 도구입니다. GitHub Pages를 통해 배포되어 있으며, 별도 설치나 로그인 없이 링크 접속만으로 전체 팀이 동일한 정보를 확인할 수 있습니다.</p><h2>주요 기능</h2><ul><li>전체 화면 목록 및 진행 단계 표시 — 기획 / 디자인 / 개발 / QA / 완료</li><li>팀별 필터링 — 특정 팀의 작업 현황만 선택해서 볼 수 있음</li><li>전체 진척률 요약 — 완료된 화면 수와 비율을 수치로 확인</li><li>최종 업데이트 일시 표시 — 데이터 기준 시점 확인 가능</li><li>반응형 레이아웃 — PC, 태블릿, 모바일 모두 지원</li></ul><h2>사용 방법</h2><p><strong>접속</strong><br>브라우저에서 배포 링크에 접속합니다. 별도 로그인이나 설치는 필요하지 않습니다.</p><p><strong>화면 현황 확인</strong><br>대시보드 메인 화면에서 전체 화면 목록을 확인할 수 있습니다. 각 행은 화면 하나를 나타내며, 현재 어느 단계에 있는지 색상과 텍스트로 표시됩니다.</p><p><strong>팀별 필터 사용</strong><br>상단 필터 탭에서 원하는 팀을 선택하면 해당 팀의 작업 항목만 표시됩니다. 전체 탭을 누르면 다시 전체 목록으로 돌아옵니다.</p><p><strong>데이터 업데이트</strong><br>대시보드의 데이터는 JavaScript 파일 내 데이터 객체를 직접 수정해 갱신합니다. 수정 후 GitHub에 푸시하면 배포 환경에 자동으로 반영됩니다.</p><h2>기술 구성</h2><p>HTML, CSS, JavaScript만으로 구성된 정적 웹 애플리케이션입니다. 별도의 서버나 데이터베이스 없이 동작하며, GitHub Pages를 통해 무료로 호스팅됩니다. 유지 비용이 없고 별도 인프라 관리가 필요 없는 구조로 설계되었습니다.</p><div class='callout'>팀 전체가 동일한 정보를 보고 있을 때 커뮤니케이션 비용이 줄어듭니다. 대시보드는 그 공통된 기준점 역할을 합니다.</div>"
    },
    {
      "id": "intro_tc-plugin",
      "title": "TC 검토 플러그인 — 프로젝트 소개 및 사용 안내",
      "date": "2026-04-10",
      "category": "프로젝트소개",

      "content": "<h2>프로젝트 개요</h2><p>문서 마스터 템플릿은 투자증권 차세대 프로젝트에서 AI Native SDLC(소프트웨어 개발 생명주기) 도입을 제안하기 위해 제작된 기획 문서입니다. 기존에는 PowerPoint 형식으로 문서를 작성해왔으나, 버전 관리의 어려움, 파일 공유 방식의 비효율, 열람 환경에 따른 레이아웃 변형 등의 문제로 인해 HTML 형식으로 전환하였습니다.</p><p>HTML 문서는 GitHub Pages를 통해 배포되어 있어 링크 하나로 누구든 최신 버전을 열람할 수 있습니다. 수정 사항이 발생하면 파일을 업데이트하고 푸시하는 것만으로 즉시 반영되며, 별도로 파일을 재배포하거나 재전송할 필요가 없습니다.</p><h2>문서 구성</h2><ul><li>프로젝트 배경 및 도입 필요성 — AI Native SDLC가 필요한 이유와 현황 분석</li><li>도입 방향 및 적용 범위 — 어떤 단계에 어떤 방식으로 AI를 적용할 것인지</li><li>단계별 실행 계획 — 도입 로드맵 및 우선순위</li><li>기대 효과 및 위험 요소 — 정량적 기대치와 리스크 항목</li><li>부록 — 참고 자료, 도구 목록, 용어 설명</li></ul><h2>사용 방법</h2><p><strong>문서 열람</strong><br>배포 링크에 접속하면 최신 버전의 문서를 바로 확인할 수 있습니다. PC와 모바일 모두 지원하며 별도 설치가 필요하지 않습니다. 인쇄 또는 PDF 저장이 필요한 경우 브라우저의 인쇄 기능(Ctrl+P / Cmd+P)을 사용합니다.</p><p><strong>버전 확인</strong><br>문서 상단 또는 파일명에 버전 번호(_v1, _v2, ...)가 표시되어 있습니다. 현재 최종 확정 버전은 v14입니다. 이전 버전은 iCloud 로컬 폴더에 보관되어 있으며, 변경 이력 추적이 필요한 경우 참고할 수 있습니다.</p><p><strong>내용 수정</strong><br>문서 내용을 수정하려면 HTML 파일을 직접 편집합니다. 수정 후에는 현재 버전 파일명을 유지하거나, 변경 사항이 중요한 경우 버전 번호를 올려 새 파일로 저장합니다. 수정된 파일을 GitHub 저장소에 푸시하면 배포 환경에 반영됩니다.</p><h2>파일 관리 구조</h2><ul><li>최종 확정본: iCloud / [2026.05.06] AI Native SDLC 도입 / DCX_투자증권차세대프로젝트_v14.html</li><li>작업 이력: 동일 폴더 내 v1~v13 파일 보관</li><li>GitHub 배포: euuezone/document-master-template 저장소</li></ul><div class='callout'>문서도 소프트웨어처럼 관리할 수 있습니다. 버전이 추적되고, 링크로 배포되고, 누구나 최신 버전을 열람할 수 있는 구조가 협업 비용을 줄입니다.</div>"

      "summary": "국내 주요 서비스 73개의 디자인 패턴과 인터랙션을 분석하여 정리한 레퍼런스 문서입니다. AI 디자인 작업 시 한국 서비스 특화 패턴을 구체적으로 참조할 수 있습니다.",
      "content": "<h2>프로젝트 개요</h2><p>Korean Design MD는 국내 주요 서비스 73개를 직접 분석하여 디자인 패턴, 인터랙션, 타이포그래피, 컬러 시스템을 정리한 레퍼런스 문서입니다. AI를 활용한 UI 생성 작업 또는 디자인 프롬프트 작성 시 \"한국 서비스 스타일\"을 구체적으로 표현하기 위한 근거 자료로 활용됩니다.</p><p>AI 이미지 생성 도구나 코드 기반 UI 생성 도구에 \"한국 금융 앱 스타일로 만들어줘\"라고 요청하면 결과가 일관되지 않는 경우가 많습니다. 이는 AI 모델이 학습한 데이터에 한국 서비스 특화 패턴이 충분히 반영되어 있지 않기 때문입니다. 이 문서는 그 간극을 메우기 위해 제작되었습니다.</p><h2>수록 내용</h2><ul><li><strong>네비게이션 패턴</strong> — 탭바, 사이드 드로어, 제스처 기반 이동 등 국내 서비스에서 자주 쓰이는 방식 분류</li><li><strong>타이포그래피</strong> — Pretendard, Noto Sans KR 등 주요 폰트의 사이즈 체계 및 행간 기준</li><li><strong>컬러 시스템</strong> — 금융, 커머스, 소셜, 헬스케어 등 카테고리별 주색상 경향 및 사용 방식</li><li><strong>컴포넌트 패턴</strong> — 버튼, 입력폼, 바텀시트, 모달, 토스트 메시지 등 구성 방식</li><li><strong>인터랙션 패턴</strong> — 스크롤 동작, 스와이프, 로딩 처리 방식 등</li></ul><h2>사용 방법</h2><p><strong>문서 열람</strong><br>배포 링크에 접속하면 카테고리별로 정리된 레퍼런스를 열람할 수 있습니다. 상단 네비게이션에서 원하는 카테고리를 선택하거나, 검색 기능으로 특정 서비스나 패턴을 바로 찾을 수 있습니다.</p><p><strong>AI 프롬프트에 활용</strong><br>AI 이미지 생성이나 UI 코드 생성 시 이 문서의 특정 패턴 설명을 프롬프트에 직접 인용합니다. 예를 들어 금융 앱 바텀시트 섹션의 설명을 복사해서 프롬프트에 포함하면 한국 금융 서비스 스타일에 가까운 결과를 얻을 수 있습니다.</p><p><strong>기획 및 디자인 레퍼런스로 활용</strong><br>새 화면을 기획하거나 디자인할 때 국내 경쟁 서비스가 동일한 상황을 어떻게 처리하는지 빠르게 확인하는 용도로 사용합니다. 서비스명 또는 기능명으로 검색하면 관련 항목을 바로 찾을 수 있습니다.</p><h2>수록 서비스 분류</h2><ul><li>금융 — 토스, 카카오뱅크, 신한SOL, KB스타뱅킹 외 다수</li><li>커머스 — 쿠팡, 네이버쇼핑, 29CM 외 다수</li><li>소셜/커뮤니티 — 카카오톡, 인스타그램 KR, 당근마켓 외 다수</li><li>생산성/유틸리티 — 네이버, 카카오맵, 토스증권 외 다수</li></ul><div class='callout'>좋은 디자인은 패턴에서 시작됩니다. 국내 사용자에게 익숙한 패턴을 알고 있으면, 새로운 화면을 기획할 때 출발점이 달라집니다.</div>"

      "id": "intro_ai-design-prompt",
      "title": "AI 디자인 프롬프트 — 프로젝트 소개 및 사용 안내",
      "date": "2026-05-15",
      "category": "프로젝트소개",
      "tags": ["AI디자인프롬프트", "프롬프트관리", "이미지생성"],

      "summary": "AI 이미지 생성 및 UI 생성에 사용하는 프롬프트를 카테고리별로 관리하고 즉시 복사해서 쓸 수 있는 도구입니다. 반복 사용되는 프롬프트를 자산으로 축적합니다.",
      "content": "<h2>프로젝트 개요</h2><p>AI 디자인 프롬프트는 Midjourney, DALL-E, Stable Diffusion, Claude 등 AI 도구에서 사용하는 프롬프트를 체계적으로 관리하기 위해 제작된 웹 기반 도구입니다. 효과가 확인된 프롬프트를 카테고리별로 저장하고, 필요할 때 검색하여 즉시 복사해서 사용할 수 있도록 설계되었습니다.</p><p>AI 도구를 반복적으로 사용하다 보면 특정 목적에 잘 맞는 프롬프트가 축적됩니다. 이를 메모장이나 메모 앱에 저장해두면 찾기 어렵고, 맥락 없이 나열된 텍스트는 재사용성이 떨어집니다. 이 도구는 프롬프트를 구조화하여 저장하고, 팀 내에서 공유할 수 있도록 지원합니다.</p><h2>주요 기능</h2><ul><li>카테고리 분류 — UI 디자인, 일러스트, 사진, 아이콘, 배너, 목업 등</li><li>키워드 검색 — 원하는 프롬프트를 즉시 검색</li><li>원클릭 복사 — 복사 버튼 클릭 시 클립보드에 즉시 저장</li><li>즐겨찾기 — 자주 사용하는 프롬프트 상단 고정</li><li>태그 기반 필터링 — 스타일, 도구, 용도별 태그로 세부 분류</li></ul><h2>사용 방법</h2><p><strong>프롬프트 검색 및 복사</strong><br>배포 링크에 접속한 뒤 상단 검색창에 원하는 키워드를 입력합니다. 관련 프롬프트가 목록에 표시되면 원하는 항목의 복사 버튼을 클릭합니다. 클립보드에 복사된 프롬프트를 AI 도구의 입력창에 붙여넣어 사용합니다.</p><p><strong>카테고리 탐색</strong><br>어떤 프롬프트가 있는지 전체적으로 살펴보고 싶은 경우, 좌측 또는 상단 카테고리 탭에서 원하는 분류를 선택합니다. 선택한 카테고리에 속한 프롬프트가 모두 표시됩니다.</p><p><strong>즐겨찾기 등록</strong><br>자주 사용하는 프롬프트는 별표 아이콘을 클릭하여 즐겨찾기에 추가할 수 있습니다. 즐겨찾기에 등록된 항목은 즐겨찾기 탭에서 모아서 확인할 수 있으며, 검색 없이 빠르게 접근할 수 있습니다.</p><p><strong>새 프롬프트 추가</strong><br>새로운 프롬프트를 등록하려면 HTML 파일 내 데이터 배열에 항목을 직접 추가합니다. 각 항목은 제목, 카테고리, 태그, 프롬프트 본문으로 구성됩니다. 추가 후 GitHub에 푸시하면 배포 환경에 반영됩니다.</p><h2>프롬프트 구성 형식</h2><p>저장된 프롬프트는 다음 항목으로 구성되어 있습니다.</p><ul><li><strong>제목</strong> — 어떤 목적의 프롬프트인지 한 줄로 표현</li><li><strong>카테고리</strong> — 용도별 대분류</li><li><strong>태그</strong> — 스타일, 도구, 색상 등 세부 속성</li><li><strong>프롬프트 본문</strong> — 실제 AI 도구에 입력하는 텍스트</li><li><strong>적용 도구</strong> — 어떤 AI 도구에서 효과가 확인되었는지</li></ul><div class='callout'>프롬프트는 자산입니다. 한 번 쓰고 버리는 것이 아니라 쌓아가면, 시간이 지날수록 AI를 더 잘 활용할 수 있는 기반이 됩니다.</div>"

      "id": "2026-04-22_api-key-leak",

      "project": "QA-ai",
      "summary": "AI 기능이 잘 되는지 확인하느라 급하게 테스트하다가, 지우려고 했던 정보를 그대로 공개 저장소에 올렸다. 30분 뒤 경고 메일이 왔다.",
      "content": "<h2>어떻게 된 일이냐면</h2><p>QA AI 도우미에 AI 기능을 처음 연결할 때였다. AI 서비스를 쓰려면 일종의 비밀번호 같은 고유 키가 필요한데, 빠르게 테스트해보고 싶어서 그 키를 파일 안에 그냥 직접 적어넣었다. 어차피 테스트 끝나면 지울 거라고 생각하면서.</p><p>테스트가 잘 됐다. 그 흥분된 상태에서 그대로 저장하고 공개 저장소에 올렸다. 올리고 나서야 아차 싶었는데 이미 늦었다.</p><p>30분쯤 지나서 경고 메일이 왔다. 저장소가 공개 상태이기 때문에 내가 적어둔 키가 그대로 노출됐고, 해당 키는 자동으로 사용 중지 처리됐다는 내용이었다. 생각보다 훨씬 빠르게 감지됐다.</p><h2>수습하면서 배운 것</h2><p>일단 키를 새로 발급받았다. 그리고 앞으로는 키를 파일 안에 직접 적지 않는 방식으로 구조를 바꿨다. 플러그인을 처음 실행하면 사용자가 직접 키를 입력하고, 그 값이 안전하게 저장되는 방식이다. 파일 어디에도 키가 없으니 저장소에 올려도 문제가 없는 구조다.</p><p>히스토리에 남아 있는 노출 기록도 지워야 했다. 생각보다 손이 많이 갔다.</p><h2>왜 이런 일이 생기냐면</h2><p>\"잠깐 테스트용이니까\"라는 생각이 문제였다. 잠깐이 실수가 된다. 특히 잘 됐을 때의 흥분된 상태에서 바로 저장하면 확인해야 할 것들을 건너뛰게 된다.</p><p>이후로는 테스트용으로 뭔가를 넣을 때 처음부터 임시 표시를 해두고 저장 전에 반드시 확인하는 습관을 들이게 됐다.</p><div class='callout'>나중에 지우면 된다는 생각은 대부분 지우지 않는다는 뜻이다.</div>"

      "project": "QA-ai",
      "summary": "오류가 계속 났는데 원인은 내가 수정하던 파일이 아니라 완전히 다른 곳에 있었다. 도구 구조를 모르면 에러를 보고도 엉뚱한 걸 고치게 된다.",
      "content": "<h2>상황</h2><p>QA AI 도우미를 처음 만들 때 오류가 계속 났다. 뭔가를 고치면 또 다른 오류가 나오는 상황이 이틀째 반복됐다. 분명히 내가 고치는 부분이 맞는 것 같은데, 고칠수록 상황이 나아지지 않았다.</p><p>처음엔 설정 문제인가 싶어서 설정을 이리저리 바꿔봤다. 그래도 안 됐다. 공식 문서를 처음부터 다시 읽었다. 거기서 특정 권한 설정을 추가해야 한다는 내용을 발견하고 추가했다. 그래도 똑같은 오류가 났다.</p><h2>어디서 막혔냐면</h2><p>피그마 플러그인은 역할이 다른 두 부분으로 나뉘어 있다. 하나는 피그마 화면에 실제로 접근해서 데이터를 읽고 쓰는 부분이고, 다른 하나는 사용자가 보는 화면(UI)을 담당하면서 외부 AI 서비스와 통신하는 부분이다. 이 둘은 완전히 분리된 환경에서 돌아간다.</p><p>나는 이틀 동안 줄곧 첫 번째 부분만 수정하고 있었다. 그런데 AI 서비스와의 통신은 두 번째 부분에서만 할 수 있었다. 즉, 내가 고쳐야 할 파일이 처음부터 달랐던 것이다.</p><h2>고치는 건 10분이었다</h2><p>구조를 이해하고 나서 올바른 위치에 코드를 옮겼다. 이틀 동안 쌓인 오류가 10분 만에 사라졌다. 허탈했다.</p><p>이후로는 새 도구를 쓸 때 직접 만지기 전에 전체 구조를 먼저 파악하는 시간을 갖게 됐다. 어떻게 돌아가는지를 모르는 상태에서 고치는 건 방향 없이 걷는 것과 같다는 걸 몸으로 배웠다.</p><div class='callout'>오류가 나는 위치와 문제가 있는 위치는 다를 수 있다. 고치기 전에 구조부터 이해해야 한다.</div>"

      "content": "<h2>왜 자동화를 하려 했냐면</h2><p>TC 대시보드의 데이터를 업데이트하려면 매번 파일을 열고, 해당 항목을 찾아서 수정하고, 저장하고 올리는 과정을 거쳐야 했다. 이 과정 자체가 어렵지는 않았지만, 반복될수록 번거롭게 느껴졌다.</p><p>그래서 구글 시트에 데이터를 관리하면 어떨까 생각했다. 시트는 누구나 쉽게 수정할 수 있고, 여러 명이 동시에 업데이트할 수도 있다. 시트가 바뀌면 대시보드도 자동으로 반영되는 구조를 만들면 훨씬 편할 것 같았다.</p><h2>어디서부터 막혔냐면</h2><p>막히는 지점이 계속 나왔다. 첫 번째 방법을 시도하면 보안 문제가 생겼다. 그걸 피하려고 두 번째 방법을 쓰면 연결이 안 됐다. 세 번째 방법으로 우회했더니 이번엔 권한 문제가 나왔다. 문제 하나를 해결하면 새로운 문제가 생기는 구조였다.</p><p>세 가지 방법을 시도하는 데 꼬박 이틀이 걸렸다.</p><h2>어느 순간 멈추게 된 이유</h2><p>이틀째 되던 날, 잠깐 멈추고 생각해봤다. 내가 불편하게 느꼈던 수동 업데이트가 실제로 하루에 몇 번이나 일어나는가. 많아야 두세 번이었다. 그 정도를 위해 이 복잡한 구조를 만들고 유지하는 게 맞는가.</p><p>자동화한다고 해서 대시보드 관리가 쉬워지는 게 아니었다. 시트와 대시보드 사이의 연결이 끊겼을 때, 데이터가 이상하게 들어왔을 때 대응해야 하는 새로운 일이 생기는 것이었다. 관리해야 할 것만 늘어났다.</p><p>결국 원래 방식으로 돌아왔다. 불편하긴 해도 단순하고 안정적인 방식이 지금 규모에서는 맞았다.</p><div class='callout'>불편함을 느낄 때마다 자동화가 답은 아니다. 얼마나 자주, 얼마나 불편한지를 먼저 따져봐야 한다.</div>"

      "id": "2026-04-25_structure-understanding",
      "title": "구조를 이해하고 나서 막혔던 것들이 한꺼번에 풀렸다",
      "date": "2026-04-25",
      "category": "해결기",
      "tags": ["QA-AI", "피그마플러그인", "문제해결"],
      "project": "QA-ai",
      "summary": "이틀을 헤매다가 피그마 플러그인이 왜 이렇게 구성되어 있는지를 이해하는 순간, 막혔던 문제들이 한꺼번에 정리됐다.",
      "content": "<h2>문제</h2><p>QA AI 도우미 플러그인을 만들면서 AI 서비스와 연결이 계속 안 됐다. 피그마에서 화면 정보를 읽어오는 건 됐는데, 그 정보를 AI에게 보내는 과정에서 막혔다. 어디서 무엇을 고쳐야 하는지 방향을 잡지 못한 채 이틀을 보냈다.</p><h2>해결의 실마리</h2><p>피그마 플러그인이 왜 두 파일로 나뉘어 있는지를 제대로 찾아보기 시작했다. 알고 보니 이 두 부분은 단순히 파일이 나뉜 게 아니라 완전히 다른 환경에서 돌아가고 있었다.</p><p>한 쪽은 피그마 화면에 접근하는 전용 환경이다. 레이어, 컴포넌트, 텍스트 등 피그마 안의 모든 것을 읽고 쓸 수 있지만, 그 대신 외부와 통신하는 기능은 제한되어 있다. 다른 쪽은 일반 웹 환경이다. 사용자가 보는 UI를 그리고, 외부 AI 서비스와 통신할 수 있다. 대신 피그마 화면에는 직접 접근할 수 없다.</p><p>그래서 두 환경은 서로 메시지를 주고받는 방식으로 협력한다. 피그마 화면 정보는 전용 환경에서 읽어서 웹 환경으로 전달하고, 웹 환경에서 AI에게 보낸 뒤 결과를 다시 받아온다.</p><h2>구조를 알고 나서 달라진 것</h2><p>이 흐름을 이해하고 나서 막혔던 부분이 어디인지 바로 보였다. 내가 이틀 동안 수정하던 위치가 틀렸다는 것도 알았다. 올바른 위치로 옮기고 나서 문제가 해결됐다.</p><p>그 이후로 기능을 추가할 때마다 이걸 어느 쪽에서 해야 하는지가 자동으로 판단됐다. 피그마 화면을 다루는 일이면 전용 환경에, 사용자에게 보여주거나 AI와 통신하는 일이면 웹 환경에. 구조를 알면 판단 기준이 생긴다.</p><div class='callout'>막혔을 때 더 열심히 고치는 것보다, 왜 이렇게 생겼는지를 먼저 이해하는 게 더 빠를 때가 있다.</div>"

      "tags": ["TC검토플러그인", "AI활용", "프롬프트"],
      "project": "TC검토_플러그인",
      "summary": "AI가 내려주는 검토 결과가 너무 길고 들쑥날쑥했다. 어떻게 써달라고 형식을 정해줬더니 깔끔하게 정리된 결과가 나오기 시작했다.",
      "content": "<h2>문제</h2><p>TC 검토 플러그인에서 검토 결과를 화면에 표시하는데, 결과가 너무 길거나 형식이 매번 달랐다. 어떤 때는 항목별로 깔끔하게 나왔고, 어떤 때는 긴 문장으로 줄줄 나왔다. UI에 깔끔하게 보여주기 어려웠고, 결과를 복사해서 쓸 때도 불편했다.</p><p>화면 크기를 늘려보거나 스크롤을 추가해보기도 했다. 어느 정도 해결됐지만 근본적인 문제는 그대로였다. 텍스트가 애초에 너무 길고 형식이 없었다.</p><h2>원인</h2><p>AI는 형식을 지정해주지 않으면 스스로 판단해서 쓴다. 그 판단이 때마다 달라지기 때문에 결과가 들쑥날쑥했던 것이다. 친절하게 설명하려다 보니 필요 이상으로 길어지기도 했다.</p><p>내가 실제로 필요한 건 간단했다. 어떤 항목이, 어떤 규칙을 위반했고, 어떻게 고쳐야 하는지. 이 세 가지면 충분했다.</p><h2>해결</h2><p>AI에게 요청할 때 결과를 어떤 형식으로 써달라고 명확하게 지정했다. 항목별로 한 줄씩, 정해진 구조에 맞게 써달라고. 마치 업무를 줄 때 양식을 함께 주는 것처럼.</p><p>형식을 지정하고 나서 결과가 일관되게 정리되어 나오기 시작했다. UI에 깔끔하게 표시할 수 있었고, 결과를 복사해서 바로 쓸 수 있게 됐다. 거기다 예상치 못한 형태의 응답이 줄어들어서 오류 처리도 훨씬 쉬워졌다.</p><div class='callout'>AI도 업무 지시와 마찬가지다. 원하는 결과물의 형식을 미리 보여주면 그 형식에 맞게 돌아온다.</div>"

      "project": "문서_마스터_템플릿",
      "summary": "내 컴퓨터에서는 잘 열렸는데 링크를 공유하면 페이지가 없다고 나왔다. 원인은 폴더 이름의 괄호 두 개였다.",
      "content": "<h2>문제</h2><p>문서 마스터 템플릿을 완성하고 링크로 공유할 수 있게 배포했다. 내 컴퓨터에서 직접 파일을 열면 잘 보였다. 그런데 배포된 링크를 열면 \"페이지를 찾을 수 없습니다\"가 나왔다.</p><p>설정이 잘못됐나 싶어서 다시 확인했다. 설정은 맞았다. 파일도 정상적으로 올라가 있었다. 배포 과정도 성공으로 표시됐다. 그런데 접속이 안 됐다.</p><h2>원인을 찾기까지</h2><p>이것저것 바꿔보다가 파일이 들어 있는 폴더 이름을 보게 됐다. 폴더 이름이 <code>[2026.05.06]AI Native SDLC 도입</code>이었다. 이름 앞에 대괄호가 있었다.</p><p>인터넷 주소에서 대괄호는 특별한 의미를 가지는 문자다. 내 컴퓨터에서 파일을 직접 열 때는 이름 그대로 인식되지만, 링크를 통해 접근할 때는 주소로 변환되는 과정에서 대괄호가 문제를 일으켰다. 파일은 있는데 주소가 가리키는 위치를 찾지 못하는 상황이 됐던 것이다.</p><h2>해결</h2><p>폴더 이름에서 대괄호를 없앴다. 변경하고 다시 올렸더니 바로 됐다.</p><p>이후로는 링크로 공유할 파일이나 폴더 이름에는 괄호, 공백, 특수문자를 쓰지 않게 됐다. 내 컴퓨터에서는 아무 문자나 써도 되지만, 링크로 접근하는 순간 이름이 주소가 된다는 걸 이때 처음 제대로 이해했다.</p><div class='callout'>파일 이름은 내 컴퓨터 안에서만 쓰일 때와 인터넷 주소가 될 때의 규칙이 다르다.</div>"

      "category": "발견",
      "tags": ["TC검토플러그인", "프롬프트", "AI활용"],
      "project": "TC검토_플러그인",
      "summary": "지시문 앞에 '당신은 QA 전문가입니다' 한 줄을 추가했더니 결과 품질이 눈에 띄게 달라졌다. 맥락을 주면 AI가 그 맥락 안에서 판단한다.",
      "content": "<h2>발견한 계기</h2><p>TC 검토 플러그인의 AI 지시문을 계속 다듬고 있었다. 어느 날 지시문 맨 앞에 역할을 명시하면 결과가 달라진다는 이야기를 들었다. \"당신은 X입니다\"라는 문장 하나가 출력 품질에 영향을 준다는 게 처음엔 잘 이해가 안 됐다. 어차피 텍스트를 처리하는 건데 역할이 무슨 상관인가 싶었다.</p><p>직접 비교해봤다. 같은 TC를 두 가지 방식으로 검토시켰다. 하나는 규칙만 설명한 버전, 하나는 첫 줄에 \"당신은 10년 경력의 QA 전문가입니다\"를 추가한 버전이었다.</p><h2>결과 차이</h2><p>역할 없이 보낸 경우 AI는 규칙 위반 여부만 판단했다. \"이 항목은 규칙을 위반합니다\"처럼 결론만 내는 수준이었다.</p><p>역할을 줬을 때는 달랐다. 어떤 부분이 왜 문제인지, 어떻게 고치면 좋은지까지 구체적으로 설명했다. 단순히 맞고 틀리고를 넘어서 실제로 수정할 때 도움이 되는 내용이 나왔다.</p><p>같은 규칙 설명, 같은 TC, 다른 결과였다.</p><h2>왜 이렇게 되는 걸까</h2><p>AI는 어마어마한 양의 글을 학습했다. 그 안에는 다양한 직군의 사람들이 쓴 글이 다 포함되어 있다. 역할을 주면 그 역할의 사람이 쓸 법한 방식으로 대답을 구성하게 된다고 이해했다. QA 전문가라는 역할을 주면, 그 사람이 후배한테 피드백하는 방식으로 쓴다.</p><p>이후에 만드는 모든 플러그인 지시문 첫 줄에 역할 정의를 추가했다. 효과는 매번 일관되게 나타났다.</p><div class='callout'>AI한테 일을 줄 때도 맥락이 필요하다. 이 사람이 누구인지를 알면 어떻게 대답해야 하는지가 달라진다.</div>"
    },

      "id": "2026-05-11_tool-structure-insight",

      "date": "2026-05-11",
      "category": "발견",
      "tags": ["QA-AI", "피그마플러그인", "도구이해"],
      "project": "QA-ai",
      "summary": "피그마 플러그인이 왜 두 부분으로 나뉘어 있는지 이해하고 나서, 기능을 어디에 넣어야 하는지 헷갈리지 않게 됐다. 구조의 이유를 알면 사용 판단이 빨라진다.",
      "content": "<h2>이걸 이해하기 전까지는</h2><p>피그마 플러그인을 처음 만들 때 파일이 두 개인 이유를 제대로 몰랐다. 그냥 기능이 많아서 나눠놓은 거겠거니 했다. 그러다 이틀 동안 엉뚱한 곳을 고치는 삽질을 하고 나서, 이 구조가 단순한 파일 분리가 아니라는 걸 알게 됐다.</p><h2>알게 된 것</h2><p>피그마 플러그인은 두 가지 완전히 다른 환경에서 동시에 돌아간다. 하나는 피그마 안을 들여다보는 전용 환경이다. 화면의 구성 요소, 텍스트, 레이어 같은 피그마 내부 정보에 접근할 수 있다. 대신 바깥 세상(외부 서비스)과 직접 통신하는 건 허용되지 않는다.</p><p>다른 하나는 일반 웹 환경이다. 사용자가 보는 플러그인 화면을 그리고, AI 같은 외부 서비스와 통신할 수 있다. 대신 피그마 내부에는 직접 들여다볼 수 없다.</p><p>피그마가 이렇게 설계한 이유가 있다. 외부에서 가져온 플러그인이 피그마 내부 데이터에 마음대로 접근하면서 동시에 아무 서버에나 정보를 보낼 수 있다면 보안 위험이 생긴다. 두 환경을 분리해서 각자 할 수 있는 것과 없는 것을 명확하게 나눠놓은 것이다.</p><h2>이걸 알고 나서 달라진 것</h2><p>구조를 이해하고 나서 기능을 추가할 때마다 판단이 빨라졌다. 피그마 화면을 다루는 일이면 전용 환경, 사용자에게 보여주거나 AI와 통신하는 일이면 웹 환경. 이 기준이 생기고 나서 어디에 넣어야 할지 고민하거나 헷갈리는 일이 없어졌다.</p><p>도구를 쓰다 보면 왜 이렇게 만들었지 싶은 순간이 온다. 그 이유를 찾아보면 대부분 납득이 가는 설계 의도가 있고, 이해하고 나면 그 도구를 훨씬 자연스럽게 쓸 수 있게 된다.</p><div class='callout'>사용법을 외우는 것과 구조를 이해하는 것은 다르다. 구조를 알면 새로운 상황에서도 판단할 수 있다.</div>"

      "project": "UX라이팅_플러그인",
      "summary": "혼자 만들면서 당연하다고 생각했던 것들이 다른 사람한테는 전혀 당연하지 않았다. 사용자 앞에서 5분을 지켜보는 게 혼자 고민하는 며칠보다 낫다.",
      "content": "<h2>어떤 상황이었냐면</h2><p>UX라이팅 플러그인을 완성하고 운영디자인팀 팀원 한 명한테 써보라고 했다. 옆에서 지켜보기만 했다. 따로 설명하지 않았다. 처음 보는 사람이 어떻게 쓰는지 그냥 보고 싶었다.</p><p>5분이 채 안 됐는데 그 팀원이 멈췄다. \"어디서 시작하면 돼요?\" 당황한 것 같았다. 화면을 다시 보니, 내가 선명하게 보이던 시작 버튼이 그 사람 눈에는 잘 안 보인 것이었다.</p><h2>내가 놓친 것들</h2><p>내가 만든 사람이라는 게 가장 큰 문제였다. 이 도구의 흐름을 너무 잘 알고 있어서, 뭘 먼저 눌러야 하는지가 너무 자명하게 느껴졌다. 처음 보는 사람한테는 그 맥락이 없다.</p><p>지켜보면서 발견된 문제가 세 가지였다. 플러그인을 열면 기능 탭 세 개가 동등한 비중으로 펼쳐지는데, 어디서 시작해야 하는지 우선순위가 없었다. 검사 버튼에 \"실행\"이라고만 적혀 있었는데 뭘 실행하는 건지 알 수 없었다. 결과가 나온 뒤에 다음에 뭘 해야 하는지 안내가 없어서, 결과를 보고 그냥 창을 닫는 경우가 있었다.</p><p>세 가지 모두 혼자 만들면서 한 번도 문제라고 느끼지 못했던 것들이었다.</p><h2>고친 것들</h2><p>첫 화면에서 제일 먼저 해야 할 행동을 시각적으로 강조했다. 버튼 텍스트를 \"텍스트 검사 시작\"으로 바꿨다. 결과 화면에 \"결과 복사하기\" 버튼과 다음 행동 안내를 추가했다.</p><p>같은 팀원한테 다시 써봐달라고 했다. 이번엔 막히는 부분 없이 끝까지 썼다.</p><h2>이 경험에서 남은 것</h2><p>사용자 앞에서 5분을 지켜보는 게 혼자 이틀을 고민하는 것보다 더 많은 걸 알려준다. 만드는 사람이 테스트하는 건 진짜 테스트가 아니다. 내가 이미 답을 알고 있기 때문에 막히지 않는다. 진짜 테스트는 처음 보는 사람이 예상대로 쓰는지 보는 것이다.</p><div class='callout'>내가 만든 걸 내가 테스트하면 아무것도 발견하지 못한다. 사용자를 보는 게 가장 빠른 개선 방법이다.</div>"

      "id": "2026-05-27_tc-plugin-v22",
      "title": "TC 검토 플러그인 v2.1 → v2.2, 프롬프트를 줄였더니 오히려 잘 됐다",
      "date": "2026-05-27",
      "category": "작업일지",
      "tags": [
        "TC검토플러그인",
        "버전업",
        "OpenAI",

      "project": "TC검토_플러그인",
      "summary": "AI한테 예시를 많이 줄수록 더 잘할 거라고 생각했는데, 오히려 예시에 갇혀서 새로운 케이스를 못 잡았다. 규칙을 간결하게 다듬었더니 v2.2에서 정확도가 올라갔다.",
      "content": "<h2>이 플러그인이 뭐하는 건지부터</h2>\n<p>TC 검토 플러그인은 투자증권 차세대 프로젝트에서 쓰는 도구다. QA를 진행할 때 TC(테스트케이스)를 작성하는데, 이 TC들이 정해진 표기 규칙에 맞게 쓰였는지 일일이 검토하는 게 굉장히 손이 많이 가는 작업이었다. 그래서 OpenAI API를 연결해서 AI가 자동으로 규칙을 확인해주도록 만든 게 이 플러그인이다.</p>\n<p>v1.0에서 기본 기능을 만들었고, v2.1까지 오면서 검토 정확도를 계속 높여왔다. 그 과정에서 가장 많이 손댄 게 AI한테 보내는 지시문, 즉 프롬프트였다.</p>\n<h2>문제가 생긴 건 \"더 잘 알려주려는\" 욕심에서 시작됐다</h2>\n<p>v2.1을 만들 때 이런 생각을 했다. \"AI가 틀리는 이유는 규칙을 잘 모르기 때문이다. 그러면 예시를 더 많이 주면 더 잘하지 않을까?\"</p>\n<p>그래서 규칙 설명 옆에 \"이런 경우는 통과\", \"이런 경우는 오류\"라는 예시를 10개 넘게 붙였다. 나름 꼼꼼하게 정리했다고 생각했고, 배포할 때도 꽤 자신 있었다.</p>\n<p>그런데 직접 테스트를 돌려보니까 이상한 결과가 나오기 시작했다. 분명히 틀린 TC인데 AI가 \"맞다\"고 통과시키는 경우가 v2.0보다 오히려 늘었다. 처음엔 내가 놓친 케이스가 있나 싶어서 규칙을 다시 확인했는데, 규칙 자체는 맞았다.</p>\n<h2>원인은 AI가 예시에 \"갇혀버린\" 것이었다</h2>\n<p>며칠 원인을 찾다가 패턴을 발견했다. AI가 틀리는 케이스들은 대부분 내가 예시로 넣지 않은 새로운 형태였다. AI 입장에서는 \"예시에 없는 패턴이니까 규칙 위반인지 확실하지 않다\"고 판단한 것 같았다. 예시가 많을수록 AI는 그 예시들을 기준으로 패턴 매칭을 하게 됐고, 예시에 없으면 애매하게 처리했다.</p>\n<p>쉽게 말하면 이런 상황이었다. 선생님이 학생한테 \"1+1=2, 2+2=4, 3+3=6\"이라고 예시만 잔뜩 보여줬더니, 학생이 덧셈의 원리는 모르고 그냥 예시를 외워버린 것. 5+5 같은 새로운 문제가 나오면 못 푸는 것과 같은 상황이었다.</p>\n<h2>v2.2에서 프롬프트를 대폭 줄였다</h2>\n<p>방향을 완전히 바꿨다. 예시를 대부분 없애고, 규칙 그 자체를 더 명확하고 간결하게 설명하는 데 집중했다. \"이런 경우는 어떻다\"가 아니라 \"이게 규칙이다\"를 정확히 전달하는 방식으로 바꿨다.</p>\n<p>결과적으로 프롬프트 길이는 절반 이하로 줄었는데, 검토 정확도는 확연히 올라갔다. 특히 예시로 없던 새로운 패턴의 TC들도 잘 잡아내기 시작했다.</p>\n<div class=\"callout\">AI 프롬프트는 많이 쓴다고 좋은 게 아니었다. 원리를 간결하게 전달할수록 AI는 더 유연하게 적용했다.</div>\n<h2>이 경험에서 배운 것</h2>\n<p>프롬프트를 쓰는 건 결국 커뮤니케이션이라는 걸 다시 깨달았다. 사람한테 일을 설명할 때도 예시를 너무 많이 주면 오히려 \"이 예시에 해당되는 것만 하면 되는 건가?\" 하고 좁게 해석하는 경우가 있다. AI도 비슷하게 동작했다.</p>\n<p>규칙의 핵심이 뭔지 파악하고, 그걸 최대한 명확하게 전달하는 것. 결국 좋은 프롬프트와 좋은 기획서는 크게 다르지 않다는 생각이 들었다.</p>"

      "summary": "기능은 그대로인데 파일 구조를 바꿨을 뿐인데 문의가 눈에 띄게 줄었다. 쓰는 사람마다 필요한 게 달랐는데 하나의 파일에 다 욱여넣고 있었던 것.",
      "content": "<h2>이 플러그인이 뭐하는 건지부터</h2>\n<p>UX라이팅 플러그인은 투자증권 운영디자인팀에 실제로 배포해서 쓰고 있는 도구다. 피그마 작업을 할 때 텍스트 표현이 가이드에 맞는지 바로 확인할 수 있게 해준다. 예를 들어 버튼 텍스트를 \"확인하기\"로 써야 하는데 \"확인\"으로 쓰면 플러그인이 잡아준다. 피그마 안에서 바로 쓸 수 있고, 별도 대시보드에서 전체 현황도 볼 수 있다.</p>\n<p>v1.0부터 시작해서 v1.7까지 기능을 계속 추가해왔다. 그런데 버전을 올릴수록 실제로 쓰는 운영디자인팀에서 비슷한 질문이 반복됐다. \"이거 어떻게 쓰는 거예요?\", \"이 기능은 어디 있어요?\" 같은 것들이었다.</p>\n<h2>v1.7까지의 구조는 이랬다</h2>\n<p>처음 만들 때는 \"한 파일에 다 있으면 편하지 않을까\"라는 생각으로 시작했다. 그래서 사용 방법 설명, 실제 플러그인 기능, 현황 대시보드까지 모두 하나의 파일 안에 탭 형태로 넣어뒀다.</p>\n<p>만드는 입장에서는 관리가 편했다. 파일 하나만 업데이트하면 되니까. 그런데 쓰는 사람 입장에서는 달랐다.</p>\n<h2>사람마다 필요한 게 완전히 달랐다</h2>\n<p>문의 내용을 모아서 분류해보니까 세 가지 유형이 뚜렷하게 나눠졌다.</p>\n<p>첫 번째는 처음 쓰는 사람들이었다. 이 사람들은 기능을 쓰기 전에 \"이게 뭔지\", \"어떻게 설치하는지\"부터 알아야 했다. 지금 구조에서는 기능 탭 사이에 설명이 섞여 있어서 원하는 정보를 찾는 게 힘들었다.</p>\n<p>두 번째는 피그마에서 실제로 작업하는 사람들이었다. 이 사람들은 설명 같은 건 필요 없고 플러그인 기능만 바로 쓰고 싶어했다. 근데 파일을 열면 제일 먼저 안내 문구가 나오니까 매번 스크롤을 내려야 했다.</p>\n<p>세 번째는 팀 리드나 관리자 역할을 하는 사람들이었다. 이 사람들은 실시간으로 \"현재 몇 개 항목이 규칙 위반인지\", \"어떤 화면에서 오류가 많은지\" 같은 전체 현황이 필요했다.</p>\n<p>같은 파일을 세 종류의 사람이 각자 다른 목적으로 쓰고 있었는데, 세 사람 모두 불편한 구조였다.</p>\n<h2>v1.8에서 파일을 세 개로 나눴다</h2>\n<p><code>01_사용가이드</code>, <code>02_플러그인(피그마)</code>, <code>03_대시보드</code>. 딱 세 폴더로 분리했다.</p>\n<p>각자 자기가 필요한 파트만 열면 됐다. 처음 세팅하는 사람은 01번만 보면 되고, 피그마 작업하는 사람은 02번을 피그마에 연결하면 되고, 현황 보는 사람은 03번을 북마크해두면 됐다.</p>\n<p>기능은 하나도 바뀐 게 없었다. 구조만 바꿨을 뿐인데, v1.8을 운영디자인팀에 전달하고 나서 \"어떻게 쓰나요\" 계열의 문의가 눈에 띄게 줄었다.</p>\n<div class=\"callout\">파일 하나가 깔끔해 보여도, 쓰는 사람이 많아지면 목적별로 나누는 게 맞다.</div>\n<h2>이 경험에서 배운 것</h2>\n<p>만드는 사람의 편의와 쓰는 사람의 편의는 다르다. 파일 하나로 관리하는 게 나한테는 편했지만, 쓰는 사람 입장에서는 자기한테 필요없는 것들과 뒤섞인 공간을 헤쳐나가야 하는 불편함이었다.</p>\n<p>UX 기획을 하면서 항상 \"사용자 동선\"을 중요하게 생각한다고 했는데, 정작 내가 만든 도구에는 그 원칙을 제대로 못 적용하고 있었다는 걸 v1.8 작업하면서 다시 깨달았다.</p>"
    },
    {
      "id": "2026-05-29_qa-ai-ui-iteration",
      "title": "QA AI 도우미 UI를 네 번 갈아엎고 나서 알게 된 것",
      "date": "2026-05-29",
      "category": "작업일지",
      "tags": [
        "QA-AI",
        "UI설계",
        "피그마플러그인",

      ],
      "project": "QA-ai",
      "summary": "기능은 v1부터 다 있었다. 근데 네 번을 갈아엎었다. 이유는 단 하나였다. 버튼이 어디 있는지 몰라서가 아니라, 다음에 뭘 해야 할지가 화면에서 안 보였기 때문이었다.",
      "content": "<h2>이 플러그인이 뭐하는 건지부터</h2>\n<p>QA AI 도우미는 피그마 안에서 TC(테스트케이스)를 자동으로 작성해주는 도구다. 화면 컴포넌트를 선택하면 OpenAI가 해당 화면에 맞는 TC를 만들어준다. QA 업무에서 TC 작성은 시간이 많이 걸리는 반복 작업인데, 이걸 자동화한 것이다.</p>\n<p>기능 자체는 v1부터 완성돼 있었다. 선택하고, 버튼 누르고, 결과 받고. 딱 세 단계였다.</p>\n<h2>그런데 왜 네 번을 갈아엎었냐면</h2>\n<h3>v1: 기능은 다 있었는데 아무도 한 번에 못 썼다</h3>\n<p>처음 만든 UI는 기능 중심으로 설계했다. \"입력 영역\", \"설정 옵션\", \"실행 버튼\", \"결과 출력\"을 각각 배치했다. 기획자 입장에서는 깔끔해 보였다.</p>\n<p>근데 처음 쓰는 사람한테 보여줬더니, 몇 초 동안 화면을 훑어보다가 \"어디서 시작하면 돼요?\"라고 물었다. 모든 요소가 동등하게 배치돼 있으니까 뭘 먼저 해야 하는지 알 수가 없었던 것이다.</p>\n<h3>v2: 순서는 맞췄는데 \"지금 뭐하는 중인지\"가 없었다</h3>\n<p>위에서 아래로 순서대로 쓰게끔 레이아웃을 바꿨다. 1번 입력 → 2번 설정 → 3번 실행 순서로. 흐름은 생겼는데 새로운 문제가 생겼다.</p>\n<p>실행 버튼을 누르고 나서 AI가 결과를 만드는 동안 화면에 아무 변화가 없었다. \"돌아가고 있는 건지\", \"오류가 난 건지\", \"그냥 느린 건지\" 알 수가 없었다. 몇몇 사람이 버튼을 여러 번 눌러서 중복 요청이 생기는 문제가 발생했다.</p>\n<h3>v3: 로딩은 넣었는데 결과가 나온 다음이 불편했다</h3>\n<p>로딩 상태를 표시하게끔 고쳤다. 그런데 이번엔 결과가 나온 이후가 문제였다. TC가 화면에 나타나긴 했는데, 그 결과를 복사하거나 수정하는 버튼이 화면 하단에 따로 떨어져 있었다. 결과를 보면서 바로 행동을 취하기가 불편했다.</p>\n<p>사람들이 결과를 보고 나서 \"이걸 어떻게 가져가요?\"라고 물어봤다. 기능이 없는 게 아니라 찾기가 어려웠던 것이다.</p>\n<h3>v4: 결과 영역을 독립시키고 액션을 바로 붙였다</h3>\n<p>결과가 나오는 영역을 화면의 메인으로 올렸다. 그리고 복사, 수정, 재생성 버튼을 결과 텍스트 바로 옆에 붙였다. 결과를 보자마자 다음 행동이 눈에 보이게 만든 것이다.</p>\n<p>v4를 배포하고 나서 처음으로 \"어떻게 쓰나요\" 질문이 없었다. 한 팀원이 \"그냥 쓰면 되네요\"라고 했는데, 그게 제일 좋은 피드백이었다.</p>\n<div class=\"callout\">UI는 기능 목록이 아니라 사용자 동선이다. 기능이 다 있어도 흐름이 없으면 못 쓴다.</div>\n<h2>이 경험에서 배운 것</h2>\n<p>네 번 갈아엎으면서 공통된 원인은 항상 같았다. \"다음에 뭘 해야 하지?\"가 화면에서 안 보이는 것. 모든 기능이 동등하게 배치돼 있으면 사용자는 매 순간 선택을 해야 한다. 그게 쌓이면 피로해지고, 결국 \"쓰기 불편한 도구\"가 된다.</p>\n<p>피그마 플러그인은 화면이 작아서 더 엄격하게 동선을 짜야 한다고 생각했다. 근데 돌이켜보면 화면 크기와 상관없이, 사용자가 지금 어디 있고 다음엔 뭘 해야 하는지가 보이는 게 기본이었다.</p>\n<p>v4로 오는 데 꽤 오래 걸렸지만, 그 과정에서 \"쓰기 좋은 UI가 뭔지\"를 추상적으로 아는 것과 실제로 만드는 것 사이의 차이를 다시 한번 실감했다.</p>"
    },

      "id": "2026-06-02_aio-report-html",
      "title": "보고서를 HTML로 만들었더니 스크린샷 업데이트가 1분도 안 걸렸다",
      "date": "2026-06-02",
      "category": "작업일지",
      "tags": [
        "TC대시보드",
        "AIO보고서",

      "project": "TC_대시보드",
      "summary": "PPT로 만들던 정기보고서를 HTML로 전환했다. 대시보드 스크린샷을 자동으로 캡처해서 바로 삽입할 수 있게 됐고, 3페이지짜리 보고서를 처음부터 다시 만들 필요가 없어졌다.",
      "content": "<h2>배경</h2><p>투자증권 차세대 프로젝트에서는 AIO(All In One) 정기보고를 주기적으로 제출한다. 지금까지 진행 상황을 정리해서 보고하는 문서인데, 매번 PowerPoint로 만들어왔다.</p><p>문제는 매회 보고 때마다 대시보드 스크린샷을 새로 찍어서 슬라이드에 교체하는 작업이 생각보다 손이 많이 간다는 것이었다. 슬라이드를 열고, 기존 이미지를 지우고, 새 스크린샷을 찍고, 크기를 맞추고, 위치를 조정하는 과정을 모든 슬라이드마다 반복해야 했다.</p><h2>HTML로 바꾼 이유</h2><p>문서 마스터 템플릿을 만들면서 HTML 문서의 장점을 직접 경험했다. 링크 하나로 공유가 되고, 파일을 주고받지 않아도 되고, 수정하면 바로 반영된다.</p><p>보고서도 같은 방식으로 만들 수 있겠다는 생각이 들었다. 특히 대시보드 스크린샷 문제는 HTML에서 이미지를 특정 방식으로 참조하면 해결될 것 같았다.</p><h2>어떻게 만들었냐면</h2><p>AIO 정기보고 3차 보고서를 HTML로 새로 설계했다. 총 3페이지 구성이었다.</p><p>첫 번째 페이지는 요약 현황이었다. 대상 기간(05/22~05/29), 담당자, 소속(DCX센터), 전체 진행률(Progress 25%), 상태를 한눈에 보여주는 섹션이다.</p><p>두 번째와 세 번째 페이지는 대시보드 상세 현황이었다. 여기서 스크린샷이 필요했다. 전체 현황, 크로스체크, 날짜별 현황(05/27~05/29) 탭의 스크린샷을 각각 넣어야 했다.</p><p>브라우저에서 대시보드 화면을 열고, 개발자 도구나 캡처 도구를 이용해 필요한 영역만 정확하게 찍었다. HTML에서는 이미지 영역의 크기와 위치가 고정돼 있어서, 새 스크린샷으로 교체해도 레이아웃이 무너지지 않았다.</p><h2>달라진 것</h2><p>PPT일 때는 스크린샷 교체에만 20~30분이 걸렸다. HTML로 바꾸고 나서 이미지 파일만 교체하면 끝이라, 1분도 안 걸렸다. 레이아웃 재조정도 필요 없었다.</p><p>보고서 링크를 슬랙에 공유하면 별도 파일 첨부 없이 바로 열람 가능하다. PPT 버전이 열리지 않는다거나 폰트가 깨진다는 문제도 없어졌다.</p><div class='callout'>보고서도 코드처럼 관리하면 반복 작업이 줄어든다. 내용만 바꾸면 되는 구조를 한 번 만들어두면 다음 보고는 훨씬 빠르다.</div><h2>이 경험에서 배운 것</h2><p>\"보고서\"라는 단어를 들으면 자동으로 PPT를 떠올렸는데, 그게 당연한 선택이 아니었다는 걸 이번에 다시 확인했다. 형식이 목적이 아니라, 전달이 목적이다. 전달이 더 잘 되는 방식이 있다면 그걸 쓰면 된다.</p>"
    },

      "project": "ISA_가이드",
      "summary": "피그마 MCP 연동이 끊기자 REST API를 직접 써서 아이콘 SVG 8개와 일러스트 PNG 3개를 추출했다. 피그마가 열려 있지 않아도, 플러그인 없이도 에셋을 꺼낼 수 있다는 걸 확인했다.",
      "content": "<h2>상황</h2><p>투자증권 ISA 가이드 페이지를 HTML로 퍼블리싱하는 작업을 했다. 피그마 파일에 있는 디자인을 그대로 코드로 옮기는 작업이었는데, 아이콘과 일러스트 이미지를 어떻게 가져올지가 문제였다.</p><p>처음엔 피그마 MCP 서버를 통해 OAuth 인증을 시도했는데 연결이 끊겼다. 방법을 바꿔서 피그마 Personal Access Token을 발급받고, REST API를 직접 호출하는 방식으로 전환했다.</p><h2>피그마 원본 vs 실제 HTML</h2><div style='display:flex;gap:16px;margin:20px 0;align-items:flex-start;flex-wrap:wrap'><div style='flex:1;min-width:140px'><p style='font-size:12px;font-weight:700;color:#6e7787;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em'>피그마 원본</p><img src='assets/figma_isa_guide.png' alt='피그마 ISA 가이드 원본' style='width:100%;border-radius:8px;border:1px solid #e8eaec'></div><div style='flex:1;min-width:140px'><p style='font-size:12px;font-weight:700;color:#6e7787;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em'>실제 HTML 렌더링</p><img src='assets/html_isa_guide.png' alt='HTML 렌더링 결과' style='width:100%;border-radius:8px;border:1px solid #e8eaec'></div></div><h2>피그마 REST API로 에셋 추출하는 방법</h2><p>피그마는 공개 REST API를 제공한다. 노드 ID를 알면 해당 요소의 이미지를 SVG나 PNG 포맷으로 내려받을 수 있다.</p><p>먼저 <code>/v1/files/{fileKey}/nodes?ids={nodeId}</code> 엔드포인트로 전체 구조를 파악했다. depth 파라미터를 높일수록 더 깊은 레이어까지 볼 수 있다. 이 데이터를 Python으로 파싱해서 아이콘과 일러스트 노드의 ID를 수집했다.</p><p>그 다음 <code>/v1/images/{fileKey}?ids={nodeId1,nodeId2}&format=svg</code>로 SVG URL을 받아서 각 파일을 다운로드했다. 일러스트는 format을 png로 바꿔서 같은 방식으로 내려받았다.</p><h2>결과</h2><p>아이콘 8개(ic_arrow_left, ic_dropdown, ic_info_graph, ic_arrow_right, ic_info_event, ic_info_money, ic_info_withdrawal, ic_arrow_down)와 일러스트 3개를 로컬에 저장했다. SVG 파일은 HTML에 인라인으로 삽입해서 외부 의존 없이 렌더링되도록 했다.</p><p>칩(chip) 컴포넌트의 빈 회색 박스 자리에 실제 피그마 아이콘이 들어갔고, 아코디언 화살표도 텍스트 문자 대신 Figma 원본 SVG 패스로 교체됐다.</p><div class='callout'>피그마 플러그인이나 MCP 없이도, REST API + 노드 ID만 있으면 에셋 전체를 꺼낼 수 있다. 한 번 파이프라인을 만들어두면 어떤 피그마 파일에서도 같은 방식으로 쓸 수 있다.</div>"
    },

      "id": "find_figma-api-pixel-perfect",
      "title": "피그마 API로 실측값을 뽑아야 HTML이 정확해진다",

      "tags": ["피그마", "REST API", "픽셀퍼펙트", "HTML", "디자인검수"],
      "project": "ISA_가이드",
      "summary": "HTML을 먼저 만들고 피그마와 비교했더니 padding, font-size, color, border-radius가 거의 다 틀렸다. API로 실측값을 뽑아서 비교표를 만드는 순서로 바꿨더니 두 번 작업이 사라졌다.",
      "content": "<h2>무엇이 달랐나</h2><p>ISA 가이드 HTML을 만들고 나서 피그마 원본과 나란히 놓고 보니 어딘가 다른 느낌이 들었다. 피그마 REST API로 실측값을 뽑아서 비교표를 만들어봤더니 이런 차이들이 나왔다.</p><ul><li>히어로 패딩: top 20px → 24px, bottom 24px → 40px</li><li>칩 border-radius: 4px → 30px (pill 모양)</li><li>포인트 라벨 font-size: 11px → 13px</li><li>포인트 설명 color: #555C70 → #777E8C</li><li>아코디언 텍스트: font-size 15px/weight 500/#111 → 14px/700/#333950</li><li>추천카드 라벨: font-size 10px → 14px</li><li>버튼 border-radius: 4px → 8px</li></ul><p>칩 하나만 봐도 border-radius가 4px(둥근 모서리)와 30px(pill)은 완전히 다른 모양이다. 숫자가 조금 다른 게 아니라 컴포넌트의 형태 자체가 달라진다.</p><h2>말풍선 꼬리가 완전히 다른 방향이었다</h2><p>가장 흥미로운 사례가 말풍선이었다. 원래 코드에는 <code>border-radius: 4px 4px 4px 0</code>에 아래쪽으로 내려가는 삼각형을 붙여놨다. 피그마 구조를 뜯어보니 완전히 달랐다.</p><p>피그마의 말풍선은 두 부분으로 구성돼 있었다. 본체 사각형(169×44, r:16)과 꼬리 벡터(10×9)인데, 꼬리는 말풍선 아래에 있는 게 아니라 왼쪽 하단에서 왼쪽으로 나오는 형태였다. 그룹 전체 크기(179×44)와 본체 크기(169×44)의 차이가 10px인데, 그 차이가 꼬리가 있는 방향이었다.</p><p>CSS로는 <code>border-radius: 16px</code>으로 본체를 만들고, <code>::after { clip-path: polygon(100% 0, 100% 100%, 0 100%); }</code>로 왼쪽 하단 10×9 삼각형을 붙이는 방식으로 재현했다.</p><h2>앞으로 쓸 순서</h2><p>HTML 코드를 먼저 쓰고 나중에 피그마와 비교하면 두 번 작업이 된다. 순서를 바꿨다.</p><ol><li>피그마 REST API로 depth 6~8 노드 데이터 추출</li><li>padding, font-size, font-weight, line-height, color, border-radius, gap 전항목 확인</li><li>비교표 작성 후 HTML 코드 작성</li></ol><div class='callout'>눈대중으로 값을 추정하면 거의 모든 값이 틀린다. 특히 color는 #333950, #777E8C, #999EA4처럼 정확한 값을 써야 하는데, #111이나 #555로 퉁치면 전혀 다른 색이 된다.</div>"
    },

      "project": "리서치_마인드맵",
      "summary": "주제를 입력하면 AI가 웹을 검색하고, 3개의 탐구 가지를 만들어줍니다. 가지를 클릭하면 계속 확장됩니다. 리서치의 시작점을 빠르게 잡을 때 씁니다.",
      "content": "<h2>프로젝트 개요</h2><p>리서치 마인드맵은 특정 주제를 탐구할 때 어디서부터 시작해야 할지 막막한 순간을 위해 만든 도구입니다. 주제를 입력하면 AI가 웹을 실시간으로 검색하고, 그 결과를 바탕으로 탐구할 만한 가지 3개를 만들어줍니다. 각 가지를 클릭하면 그 주제가 다시 검색 대상이 되어 마인드맵이 계속 확장됩니다.</p><p>기획, 리서치, 아이데이션 초기 단계에서 \"이 주제에 어떤 하위 개념들이 있는지\"를 빠르게 파악할 때 유용합니다. AI가 검색 결과를 요약해서 노드로 만들어주기 때문에, 직접 검색어를 반복해서 입력하거나 결과를 정리하는 과정이 줄어듭니다.</p><h2>주요 기능</h2><ul><li>주제 입력 → 실시간 웹 검색 — Tavily API로 최신 정보 검색</li><li>AI 탐구 가지 생성 — GPT-4o가 검색 결과를 분석해 3개의 관련 개념 생성</li><li>무한 확장 마인드맵 — 각 노드를 클릭하면 해당 주제를 다시 탐구해 계속 확장</li><li>노드 상세 보기 — 각 가지에 대한 요약 정보와 출처 확인 가능</li><li>React Flow 기반 인터랙티브 캔버스 — 드래그, 줌, 팬 지원</li></ul><h2>기술 구성</h2><ul><li>프레임워크: Next.js (App Router)</li><li>마인드맵 렌더링: React Flow</li><li>웹 검색: Tavily API</li><li>AI 분석: GPT-4o (OpenAI)</li><li>배포: Vercel</li></ul><h2>사용 방법</h2><p><strong>시작하기</strong><br>https://research-mindmap.vercel.app 에 접속합니다. 중앙 입력창에 탐구하고 싶은 주제를 입력하고 엔터를 누릅니다. AI가 웹을 검색하는 동안 로딩 상태가 표시됩니다.</p><p><strong>마인드맵 확장하기</strong><br>첫 번째 탐구가 완료되면 3개의 가지가 생성됩니다. 각 가지를 클릭하면 그 개념을 중심으로 새로운 탐구가 시작됩니다. 여러 방향으로 계속 확장하면서 주제의 전체 구조를 파악할 수 있습니다.</p><p><strong>노드 확인</strong><br>각 노드 위에 마우스를 올리거나 클릭하면 해당 가지에 대한 요약 정보와 검색 출처가 표시됩니다. 더 깊이 들어가고 싶은 개념을 선택해서 계속 탐구할 수 있습니다.</p><h2>사용 시 유의사항</h2><ul><li>Tavily API와 OpenAI API 사용 비용이 발생합니다.</li><li>실시간 웹 검색을 사용하므로 네트워크 환경에 따라 응답 시간이 다를 수 있습니다.</li><li>마인드맵은 세션 기반으로 저장됩니다. 페이지를 새로고침하면 초기화됩니다.</li></ul><div class='callout'>리서치의 첫 번째 질문을 찾는 데 쓰는 도구입니다. AI가 방향을 제안하고, 어느 방향으로 더 깊이 들어갈지는 직접 결정합니다.</div>"

    {
      "id": "2026-06-09_research-mindmap-v2-prd",
      "title": "리서치 마인드맵 v2 — PRD 작성 완료",
      "date": "2026-06-09",
      "category": "작업일지",
      "tags": ["리서치마인드맵", "v2", "PRD", "기획", "마인드맵"],
      "project": "리서치_마인드맵",
      "summary": "v1을 쓰면서 쌓인 4가지 문제를 정리하고, v2 개선 방향을 PRD로 작성했다. 카드형 노드, 나무가지 레이아웃, 문서 자동 생성, 인라인 편집, 템플릿 시스템까지 7개 Phase로 나눠서 순서대로 진행할 예정이다.",
      "content": "<h2>v1에서 뭐가 문제였나</h2><p>리서치 마인드맵 v1을 실제로 써보면서 불편한 점이 4가지로 정리됐다.</p><ul><li><strong>검색 결과가 안 보인다</strong> — Tavily가 뉴스·블로그·논문을 검색해서 GPT에 넘기는데, 사용자에게는 링크나 출처가 전혀 표시되지 않는다. AI가 요약해준 텍스트만 나온다.</li><li><strong>레이아웃이 불안정하다</strong> — 방사형(radial) 배치라서 가지가 많아지면 서로 겹친다. 노드를 클릭해서 확장할 때마다 기존 노드 위치가 튀는 현상이 있다.</li><li><strong>가지가 항상 3개다</strong> — 검색 결과가 얼마나 나오든 무조건 3개 가지만 만든다.</li><li><strong>탐색 결과를 문서로 못 만든다</strong> — 마인드맵으로 탐색은 되는데, 그 결과를 발표 자료나 보고서로 정리하려면 별도 툴에서 복붙해야 한다.</li></ul><h2>v2에서 뭘 바꾸는가</h2><p>v2의 핵심은 '탐색 → 수집 → 문서화'를 한 흐름으로 연결하는 것이다.</p><p><strong>화면 1 — 탐색 마인드맵 개선</strong><br>노드를 텍스트 원형에서 카드형으로 바꾼다. 카드에는 뉴스·논문·블로그·유튜브 배지, 썸네일 이미지, 제목, AI 요약 2~3문장, 출처명·날짜가 들어간다. 레이아웃은 방사형에서 좌→우 나무가지형(dagre)으로 전환한다. 카드마다 상세보기·선택·확장 3가지 동작이 생긴다.</p><p><strong>화면 2 — 리서치 문서 자동 생성</strong><br>마음에 드는 카드를 선택 서랍에 모은 뒤 '문서로 정리하기' 버튼을 누르면, AI가 선택한 자료들을 분석해서 DCX v14 슬라이드 형식으로 리서치 문서를 자동 생성한다. 표지·개요·핵심 인사이트·공통 패턴·종합 시사점 5종 슬라이드로 구성된다.</p><p><strong>인라인 편집과 다운로드</strong><br>생성된 슬라이드는 웹에서 바로 수정할 수 있다. 텍스트를 클릭하면 contenteditable로 편집되고, 이미지를 클릭하면 교체된다. 편집이 끝나면 HTML을 PNG로 캡처해서 PDF와 PPTX로 내보낸다. 웹에서 보이는 것과 다운로드 결과가 완전히 동일하다.</p><p><strong>템플릿 시스템</strong><br>Korean Design MD에 있는 73개 서비스 목록에서 거래처를 선택하면, 해당 서비스의 대표색·팔레트가 슬라이드 CSS 변수에 자동 적용된다. 목록에 없는 거래처는 직접 색상을 입력해서 저장할 수 있다.</p><h2>개발 로드맵</h2><ul><li>Phase 1 — 탐색 마인드맵 개선 (카드 노드·나무가지 레이아웃·상세 패널·선택 서랍)</li><li>Phase 2 — 문서 생성 API (/api/summarize · GPT 프롬프트 설계)</li><li>Phase 3 — 슬라이드 뷰어 (DCX v14 Next.js 컴포넌트화)</li><li>Phase 4 — 인라인 편집 (텍스트 편집·이미지 교체·초기화)</li><li>Phase 5 — 템플릿 시스템 (거래처별 CSS 테마·Korean Design MD 연동)</li><li>Phase 6 — 다운로드 (PNG 캡처 → PDF/PPTX)</li><li>Phase 7 — 배포 및 QA</li></ul><div class='callout'>v1이 '탐색 도구'였다면, v2는 '탐색 + 문서화 원스톱 도구'다. Phase별로 완성하면서 중간 결과를 계속 확인할 예정이다.</div>"

      "content": "<h2>왜 v3인가</h2><p>v2 PRD를 쓰면서 방향이 크게 바뀌었다. 원래는 마인드맵으로 탐색하고 카드를 골라서 문서를 만드는 흐름이었다. 그런데 실제로 문서를 만들려면 그 전에 해결해야 할 것들이 있었다. 보고서인지 제안서인지, 누가 읽는 문서인지, 어떤 내용을 담을지. 이걸 먼저 잡지 않으면 마인드맵 탐색 자체가 방향을 잃는다.</p><p>그래서 v3에서는 탐색을 시작하기 전에 문서 기획 단계를 추가했다.</p><h2>달라지는 흐름</h2><p>기존 v2 흐름은 '주제 입력 → 마인드맵 탐색 → 카드 선택 → 문서 생성'이었다. v3에서는 5단계로 바뀐다.</p><ul><li><strong>Step 1 — 문서 유형 선택</strong> : 보고서 또는 제안서를 먼저 고른다. 선택에 따라 이후 질문 항목과 기본 목차 구조가 달라진다.</li><li><strong>Step 2 — PRD 만들기</strong> : 채팅으로 AI와 대화하거나, 가진 자료를 파일로 올리면 AI가 분석해서 문서 목적·독자·핵심 키워드를 자동 정리한다. 결과를 확인하고 수정한 뒤 확정한다.</li><li><strong>Step 3 — 목차 편집</strong> : PRD 기반으로 AI가 목차를 자동 생성한다. 드래그로 순서를 바꾸거나 항목을 추가·삭제할 수 있다.</li><li><strong>Step 4 — 섹션별 마인드맵</strong> : 목차 항목 하나당 마인드맵 하나. 웹 검색 결과와 내가 올린 자료를 함께 탐색하면서 각 섹션에 담을 내용을 고른다.</li><li><strong>Step 5 — 최종 문서</strong> : 섹션 내용이 합쳐져서 슬라이드 문서가 완성된다. 인라인 편집 후 PDF·PPTX로 내보낸다.</li></ul><h2>새로 생긴 것들</h2><p><strong>내 자료 올리기</strong> — Step 4 마인드맵 화면에서 PDF·Word·이미지를 올리면 AI가 분석해서 카드 노드로 만들어준다. '내 자료' 배지가 붙어서 웹 검색 카드와 구분된다. 섹션마다 따로 올릴 수 있다.</p><p><strong>온보딩 안내</strong> — 처음 진입하면 전체 5단계를 한눈에 보여주는 모달이 뜬다. 각 단계 아이콘·이름·한 줄 설명·예상 시간이 표시된다. 작업 중에는 상단에 스텝 바가 고정되어 현재 어느 단계인지 항상 확인할 수 있다.</p><h2>개발 로드맵 (Phase 재편)</h2><ul><li>Phase 1 — 온보딩 + 문서 유형 선택</li><li>Phase 2 — PRD 만들기 (채팅 대화 · 파일 업로드 · /api/prd)</li><li>Phase 3 — 목차 생성 & 편집 (/api/toc · 드래그 앤 드롭)</li><li>Phase 4 — 섹션별 마인드맵 (Tavily 개선 · 카드 노드 · 내 자료 업로드)</li><li>Phase 5 — 최종 문서 생성 (/api/summarize · 슬라이드 렌더러)</li><li>Phase 6 — 인라인 편집 & 다운로드</li><li>Phase 7 — 배포 및 QA</li></ul><p><a href='https://euuezone.github.io/dcx-blog/PRD_리서치마인드맵_v2_v3.html' target='_blank'>→ PRD 전체 문서 보기</a></p><div class='callout'>v2가 '탐색 + 문서화'였다면, v3는 '기획 → 탐색 → 문서화' 전 과정을 한 흐름으로 잇는다.</div>"

      "project": "2분기리서치",
      "summary": "투자정보구독서비스 시장 트렌드를 담은 31슬라이드짜리 HTML 프레젠테이션을 만들었다. Python 빌드 스크립트로 섹션을 조립하고, 폰트 로딩 타이밍 문제까지 해결했다.",
      "content": "<h2>이 문서가 뭔지부터</h2><p>투자정보구독서비스 트렌드 리포트는 구독경제 흐름 속에서 투자정보 서비스 시장이 어떻게 변하고 있는지를 정리한 31슬라이드 HTML 프레젠테이션이다. 커버, 목차, Executive Summary부터 구독경제 트렌드 분석, 국내외 투자정보 서비스 벤치마킹, Appendix까지 총 5개 챕터로 구성된다.</p><p>기존에 PowerPoint로 만들던 방식 대신 HTML+CSS 기반으로 전환했다. 브라우저에서 키보드·버튼으로 슬라이드를 넘기면서 볼 수 있고, 링크 하나로 공유된다.</p><h2>어떻게 만들었나</h2><p>Claude.ai에서 섹션별로 HTML을 작성하고 Python 빌드 스크립트로 31개 섹션을 하나의 파일로 조립했다. 각 섹션은 1920×1080 기준으로 설계하고 CSS <code>scale()</code>로 화면 크기에 맞게 축소해서 표시한다.</p><p>가장 오래 걸린 부분은 governance box DOM 처리였다. 중첩된 div 구조를 정규식으로 처리하다가 내부 div에서 조기 종료되는 버그가 생겼다. s11과 s12 슬라이드 레이아웃이 깨지는 원인이었다. 최종적으로 depth를 직접 추적하는 알고리즘으로 교체해서 해결했다.</p><h2>차트가 새로고침하면 깨지던 문제</h2><p>완성하고 보니 페이지를 새로고침하면 차트가 잠깐 깨진 상태로 보이다가 1~2초 뒤에 정상으로 돌아오는 현상이 있었다. Pretendard 웹 폰트가 로드되기 전에 슬라이드가 먼저 렌더링되어서였다.</p><p><code>document.fonts.ready</code> API로 해결했다. 이 API는 문서에 쓰인 모든 폰트 로딩이 끝났을 때 resolve되는 Promise를 반환한다. 로딩 오버레이를 없애기 전에 <code>await document.fonts.ready</code>를 기다리도록 바꾸니 새로고침해도 깔끔하게 표시됐다.</p><h2>슬라이드 구성</h2><ul><li>s1 커버 / s2 목차 / s3~5 Executive Summary</li><li>s6~9 구독경제 트렌드 (시장 규모, 성장 요인, 한국 현황)</li><li>s10~13 투자정보 서비스 분석 (국내외 현황, 수익 모델)</li><li>s14~27 벤치마킹 (블룸버그, 팩트셋, Seeking Alpha, 토스증권 외 다수)</li><li>s28~31 Appendix (데이터 표, 용어 정리)</li></ul><p><a href='https://euuezone.github.io/dcx-blog/투자정보구독서비스_트렌드리포트_v1.html' target='_blank'>→ 트렌드 리포트 보기</a></p><div class='callout'>HTML 프레젠테이션으로 만들면 버전 관리가 쉽고 배포는 링크 하나로 끝난다. 다음에 내용을 업데이트할 때 스크린샷을 다시 찍거나 파일을 재배포할 필요가 없다.</div>"

      "content": "<h2>이 보고서가 뭔지부터</h2><p>투자증권 2분기 UX 리서치 결과를 정리한 웹 보고서다. 커버, 목차, 섹션별 분석 내용으로 구성되고, 화면에서 슬라이드처럼 한 장씩 넘겨가며 볼 수 있다.</p><p>원래는 PowerPoint로 만들었는데, 웹 문서로 바꾸면 수정이 빠르고 링크 하나로 바로 공유할 수 있어서 전환했다. 이번 버전에서 PPT로 저장하는 기능을 추가했다.</p><h2>PPT 저장을 어떻게 만들었나</h2><p>보통 웹 화면을 PPT로 변환하면 화면을 사진 찍듯이 캡처해서 슬라이드에 붙이는 방식을 쓴다. 이러면 PPT 파일을 받아도 글자를 수정할 수 없고, 표도 이미지 상태라 건드릴 수 없다.</p><p>이번에는 화면에 있는 글자, 표, 이미지를 하나씩 PPT 요소로 직접 변환해서 넣는 방식을 썼다. 결과물이 진짜 PPT 구성 요소로 이루어져 있어서, 받은 파일에서 글자와 표를 바로 수정할 수 있다.</p><h2>크기를 맞추는 게 핵심이었다</h2><p>웹 화면 크기와 PPT 슬라이드 크기가 달라서 비율을 정확하게 맞추는 계산이 필요했다. 이 비율을 틀리면 웹에서 보이는 것과 PPT로 나오는 것의 간격이나 글자 크기가 달라진다. 비율을 맞추고 나니 웹과 PPT가 거의 똑같이 보였다.</p><h2>슬라이드 구성</h2><p>슬라이드는 세 종류로 나뉜다.</p><ul><li>표지 — 파란 배경, 제목·부제목·날짜</li><li>챕터 구분 — 챕터 번호와 제목만</li><li>내용 슬라이드 — 본문 텍스트, 표, 이미지</li></ul><p>표는 PPT에서도 셀 색상과 테두리가 살아있는 진짜 표로 들어간다. 이미지도 파일 의존 없이 PPT 안에 통째로 삽입된다.</p><p><a href='https://euuezone.github.io/dcx-blog/2분기리서치_v3.html' target='_blank'>→ 2분기 리서치 보고서 보기</a></p><div class='callout'>웹으로 만들면 수정하고 PPT 버튼 한 번으로 파일이 나온다. 내용이 바뀌어도 다시 PPT를 처음부터 만들 필요가 없다.</div>"

      "content": "<h2>뭘 바꿨나</h2><p>투자정보구독서비스 트렌드 리포트(35슬라이드 + 부록)를 연속으로 업데이트했다. 크게 세 가지 작업이었다.</p><h2>1. 비교 사례 전면 교체</h2><p>기존에 삼성증권 POP을 비교 분석 사례로 썼는데 KB PRIME Club으로 바꾸게 됐다. 이름만 바뀐 게 아니라 해당 서비스에 대한 내용 전체가 달라졌다. 서비스 개요 표, 사례 분석 내용, 비교 차트, 부록 참고자료까지 관련 슬라이드를 전부 새로 썼다.</p><p>목차에서 각 슬라이드로 이동하는 링크도 새 내용에 맞게 전부 다시 맞췄다.</p><h2>2. 외부 링크 48개 추가</h2><p>대표 사례 페이지, 서비스명, 부록 참고자료에 외부 링크를 달았다. 총 48개다. 발표할 때 청중이 서비스를 직접 확인하고 싶어도 링크가 없으면 찾기 번거롭다는 피드백을 반영했다.</p><p>글꼴을 하나로 통일하는 작업도 함께 했다. 여러 군데에서 다른 글꼴을 불러오고 있어서 Pretendard로 정리했다. 글꼴이 완전히 불러와진 다음에 슬라이드가 보이도록 바꿔서 글자가 깜빡이는 현상도 없앴다.</p><h2>3. 화면 오류 두 가지</h2><p><strong>PDF 저장 시 슬라이드 오른쪽이 잘리는 문제</strong><br>좌우 두 칸으로 나뉜 슬라이드가 PDF 저장과 전체화면 모드에서 오른쪽이 잘렸다. 슬라이드 크기를 줄이는 배율 계산이 잘못되어 있었다. 수치를 바로잡았더니 PDF에서도 슬라이드 전체가 온전하게 나왔다.</p><p><strong>차트가 PDF에서 빈 채로 나오는 문제</strong><br>9번 슬라이드 차트를 PDF로 저장하면 차트 자리가 비어있게 나왔다. 배치 방식을 바꾸고 나니 PDF 저장 시에도 차트가 정상으로 캡처됐다.</p><p>하단 로고 이미지 크기도 여러 슬라이드에서 제각각이었는데 동일한 크기로 통일했다.</p><p><a href='https://euuezone.github.io/dcx-blog/투자정보구독서비스_트렌드리포트_v4.html' target='_blank'>→ 트렌드 리포트 보기</a></p><div class='callout'>PDF 저장 오류는 대부분 크기 계산이 틀려서 생긴다. 화면에서 잘 보인다고 PDF도 잘 나온다는 보장이 없다는 걸 이번에 확실히 알았다.</div>"

      "content": "<h2>이걸 왜 만들려 했냐면</h2><p>megaflow에서 리서치 결과를 문서로 정리할 때, 텍스트를 표나 차트로 바꾸는 작업을 매번 손으로 하고 있었다. 비교 데이터를 표로 만들고, 수치 데이터를 차트로 변환하는 과정이 반복됐다.</p><p>그래서 텍스트를 넣으면 AI가 어떤 시각화가 어울리는지 추천해주는 도구를 만들기로 했다.</p><h2>설계한 것</h2><p>왼쪽에 텍스트를 붙여넣으면 AI가 세 가지 중 하나를 추천하는 구조로 설계했다. 표, 차트, 인포그래픽. 추천된 유형은 클릭 한 번으로 다른 유형으로 바꿀 수 있게 한다. 결과물은 PNG로 다운로드하거나 HTML 코드로 복사할 수 있다.</p><p>레이아웃은 좌우 2단으로 잡았다. 왼쪽은 입력 영역(380px 고정), 오른쪽은 결과 미리보기(가변).</p><h2>기획부터 코드 작성까지 에이전트로</h2><p>이번 작업은 처음으로 기획 → 디자인 → 개발 에이전트를 순서대로 써봤다. 기획 에이전트가 요구사항을 정리해서 기획서.md를 만들었고, 디자인 에이전트가 색상·타이포·레이아웃 스펙을 디자인.md로 정리했다. 개발 에이전트는 두 문서를 받아서 HTML 파일을 작성했다.</p><p>에이전트 파이프라인이 없었다면 기획·디자인·개발을 한 대화 안에서 뒤섞었을 텐데, 각 에이전트가 역할에만 집중하니까 결과물이 더 일관됐다.</p><h2>지금 상태</h2><p>코드는 작성된 상태지만 아직 실제로 열어서 동작을 확인하지 못했다. 다음 단계는 직접 실행해보고 검수한 뒤, megaflow에 연결할지 단독으로 배포할지 결정하는 것이다.</p><div class='callout'>기획서와 디자인 스펙이 먼저 있으면 코드를 쓸 때 결정해야 할 게 줄어든다. 에이전트 파이프라인이 그 순서를 강제해준다.</div>"

      "id": "2026-07-02_figma-mcp-comparison",
      "title": "Claude에서 피그마를 연결하는 방법이 3가지나 있다 — 어떻게 다른지 비교해볼 예정이다",
      "date": "2026-07-02",
      "category": "발견",
      "tags": ["FigmaMCP", "피그마", "MCP", "Claude", "비교"],
      "project": "Figma_MCP_비교",
      "summary": "Claude에서 피그마를 다루는 MCP가 3가지 있다는 걸 알게 됐다. 공식 Figma MCP, GLips의 오픈소스 MCP, ClaudeTalkToFigma. 각각 연결 방식이 다른데, 같은 파일로 직접 테스트해서 비교해볼 계획이다.",
      "content": "<h2>Claude에서 피그마를 연결하는 방법이 3가지</h2><p>Claude에서 피그마를 직접 다루는 MCP(도구 연결 방식)가 세 가지 있다는 걸 알게 됐다. 공식 Figma MCP(mcp.figma.com), GLips가 만든 오픈소스 MCP(figma-developer-mcp), ClaudeTalkToFigma. 셋 다 Claude에서 피그마를 제어한다는 목적은 같은데, 연결 방식이 다르다.</p><ul><li>공식 Figma MCP — OAuth 인증 방식</li><li>GLips MCP — API 키 방식</li><li>ClaudeTalkToFigma — 로컬 소켓 서버 방식 (포트 3055)</li></ul><p>방식이 다르면 설치 난이도, 사용할 수 있는 기능, 실제 출력 품질도 달라질 수 있다. 어떤 상황에 어떤 게 맞는지 직접 써봐야 알 수 있어서, 같은 피그마 파일로 비교 테스트를 계획하게 됐다.</p><h2>비교 기준</h2><p>테스트 기준은 두 가지로 잡았다.</p><ul><li>AI → 피그마: Claude가 직접 피그마에 디자인을 만들어 넣기</li><li>피그마 → 코드: 피그마 디자인을 HTML/CSS로 변환하기</li></ul><p>테스트에 쓸 파일은 ISA 가이드 피그마 파일로 정했다. 세 가지 MCP 모두 같은 파일로 테스트해야 결과를 제대로 비교할 수 있다.</p><h2>지금 상태</h2><p>현재는 어떤 MCP가 있는지 파악하고 비교 기준을 정리한 단계다. 아직 설치와 실제 테스트는 하지 않았다. 테스트를 완료하면 3가지 MCP 결과를 한눈에 볼 수 있는 비교 문서 HTML을 만들 예정이다.</p><div class='callout'>같은 목적이라도 MCP마다 방식이 다르면 잘 맞는 상황도 다르다. 직접 써보기 전까지는 비교가 안 된다.</div>"

    {
      "id": "2026-07-06_figma-mcp-test-complete",
      "title": "피그마를 Claude로 직접 수정하는 MCP 3가지, 직접 테스트한 결과",
      "date": "2026-07-06",
      "category": "작업일지",
      "tags": ["FigmaMCP", "피그마", "MCP", "Claude", "ClaudeTalkToFigma"],
      "project": "Figma_MCP_비교",
      "summary": "공식 Figma MCP, GLips MCP, ClaudeTalkToFigma 3가지를 같은 피그마 파일로 직접 테스트했다. 피그마 수정은 CTF, 코드 생성은 공식 MCP가 우위였다.",
      "content": "<h2>3가지를 같은 파일로 테스트했다</h2><p>Claude에서 피그마를 연결하는 MCP가 3가지 있다. 공식 Figma MCP(mcp.figma.com), GLips가 만든 오픈소스 MCP, ClaudeTalkToFigma. 이전에 어떤 게 있는지 정리한 적이 있는데, 이번엔 실제로 같은 피그마 파일로 다 써봤다.</p><p>테스트 기준은 두 가지였다. 첫째, Claude가 말로 지시하면 피그마 디자인이 직접 바뀌는가(AI → 피그마 수정). 둘째, 피그마 화면을 읽어서 HTML 코드를 얼마나 잘 만드는가(피그마 → 코드 생성).</p><h2>테스트 1: 피그마 직접 수정</h2><p>세 화면에 같은 지시를 내렸다. 텍스트 한글화, 카드 색상 변경, 버튼·입력 필드 색상 변경.</p><ul><li><strong>ClaudeTalkToFigma(CTF)</strong> — 세 화면 모두 변경됐다. 텍스트 17개를 한 번에 한글로 바꿨고, 카드 색상과 버튼 색상도 원하는 대로 적용됐다. WebSocket으로 피그마에 연결해서 명령을 실시간으로 전달하는 방식이라 변경사항이 캔버스에 바로 보였다. 84개 쓰기 명령을 지원한다.</li><li><strong>공식 Figma MCP</strong> — 처음엔 OAuth 인증이 안 됐다. Claude Desktop에 최적화된 구조라 Claude Code에서는 재인증이 필요했다. 재인증 후 use_figma 도구로 색상 변경 3개 화면을 완료했다. 이쪽도 피그마 캔버스에 실시간으로 반영됐다.</li><li><strong>GLips MCP</strong> — 수정 명령이 아예 없다. get_figma_data, download_figma_images 두 가지 도구만 있어서 읽기만 된다. 피그마 수정이 목적이라면 이 MCP는 쓸 수 없다.</li></ul><h2>테스트 2: 피그마 → 코드 변환</h2><p>같은 화면을 읽어서 HTML/코드로 만들어달라고 했다.</p><ul><li><strong>공식 Figma MCP</strong> — React + Tailwind CSS 코드를 만들었다. 이미지 에셋 URL 28개도 자동으로 포함됐다. 세 가지 중 코드 품질이 가장 높았다.</li><li><strong>GLips MCP</strong> — 화면 구조를 텍스트로 정리해서 출력한다. 53KB 분량의 색상·폰트·레이아웃 정보를 뽑아줬다. 이 텍스트를 바탕으로 코드를 따로 작성해야 하지만, 컨텍스트로는 충분하다.</li><li><strong>CTF</strong> — 화면을 PNG로 내보내는 게 전부다. 코드 생성 도구가 없다.</li></ul><h2>추가로 해본 것</h2><p>공식 Figma MCP의 upload_assets 도구를 써서 피그마 캔버스 안에 MCP별 비교 보드를 직접 만들었다. Before/After 스크린샷을 나란히 배치하는 레이아웃을 자동으로 생성하는 방식이었다. CTF 행은 완성됐다. upload_assets는 공식 MCP에만 있는 기능이라 CTF나 GLips로는 이 작업 자체를 할 수 없다.</p><h2>토큰 차이가 컸다</h2><p>같은 화면 하나를 처리하는 데 사용한 토큰이 MCP마다 크게 달랐다. CTF는 필요한 노드만 개별 조회해서 약 4,500토큰. 공식 MCP는 전체 화면과 이미지 에셋 URL을 한꺼번에 내려받아서 약 25,000토큰. GLips도 53KB 텍스트를 한번에 출력해서 약 15,000토큰이었다.</p><div class='callout'>피그마 수정 자동화는 CTF, 코드 생성과 에셋 추출은 공식 MCP, 가볍게 구조만 파악할 때는 GLips. 목적에 따라 MCP를 선택하면 된다.</div><a href='./figma-mcp-v8.html' target='_blank' class='report-link'>→ Figma MCP 3종 비교 리포트 전체 보기</a>"

    {
      "id": "2026-07-02_claude-code-env",
      "title": "Claude Code 작업 환경을 대폭 개선했다 — 에이전트 파이프라인, 훅, 상태바",
      "date": "2026-07-02",
      "category": "작업일지",
      "tags": ["ClaudeCode", "에이전트", "자동화", "환경설정"],
      "project": "Claude_Code_환경",
      "summary": "기획·디자인·개발·검수 에이전트 4종 파이프라인을 구축하고, 파일 저장 시 PROJECTS.md 자동 업데이트, 상태바, 약어 시스템까지 한꺼번에 정비했다.",
      "content": "<h2>무엇을 만들었나</h2><p>Claude Code를 매일 쓰면서 반복되는 불편함이 쌓였다. 작업이 끝날 때마다 PROJECTS.md를 손으로 업데이트해야 했고, 백업도 직접 했다. 기획·디자인·개발을 한 대화에서 다 하다 보니 역할이 뒤섞이는 경우도 있었다. 이번에 이것들을 한꺼번에 정비했다.</p><h2>에이전트 파이프라인 4종</h2><p>기획 → 디자인 → 개발 → 검수 순서로 이어지는 에이전트를 만들었다. 각 에이전트는 역할이 분리되어 있다.</p><ul><li>기획 에이전트: 요구사항을 정리해서 기획서.md 작성</li><li>디자인 에이전트: 기획서를 받아서 색상·타이포·레이아웃 스펙 작성</li><li>개발 에이전트: 기획서와 디자인 스펙을 받아서 실제 코드 작성</li><li>검수 에이전트: 결과물을 기획서와 대조해서 QA, 통과 시 자동 백업 + PROJECTS.md 업데이트</li></ul><p>바탕화면에 에이전트별 아이콘을 만들어서 더블클릭으로 바로 실행할 수 있다.</p><h2>훅 시스템</h2><p>세 가지 훅을 추가했다. 휴스턴 폴더에 파일을 저장하면 PROJECTS.md가 자동으로 업데이트된다. 컨텍스트가 꽉 차기 전에 경고가 뜬다. 작업이 완료되면 알림이 온다.</p><p>처음에 PROJECTS.md 업데이트 훅을 AI 에이전트 방식으로 만들었는데, 매번 토큰이 소비되는 게 부담이었다. bash 스크립트 방식으로 바꿨더니 속도도 빨라지고 비용도 줄었다.</p><h2>상태바와 약어</h2><p>화면 하단 상태바에 컨텍스트 사용률, 예상 초기화 시각, 세션 비용, 현재 로그인 계정을 한 줄에 표시한다. 처음에 두 줄로 만들었다가 Claude Code가 멀티라인 상태바를 지원하지 않는다는 걸 알고 한 줄로 압축했다.</p><p>자주 쓰는 명령은 약어로 등록했다. ///p는 PROJECTS.md 읽기, ///u는 상태 업데이트, ///기는 기획 에이전트 실행, cct/ccp는 팀·개인 계정 전환이다.</p><div class='callout'>반복하는 게 보이면 자동화할 수 있는지 먼저 생각해보게 됐다. 한 번 세팅하면 그다음부터는 그냥 된다.</div>"
    }
  ]
};

// ── Projects ──────────────────────────────────────────────────────────────────
const PROJECTS = [
  { name: 'TC 대시보드', version: 'v14', url: 'https://euuezone.github.io/tc-dashboard/', desc: '투자증권 차세대 프로젝트 작업 현황을 한눈에 볼 수 있는 웹 대시보드' },
  { name: 'TC 검토 플러그인', version: 'v2.2', url: 'https://euuezone.github.io/tc-review-plugin/', desc: 'TC 표기 규칙을 AI가 자동 검토해주는 피그마 플러그인. OpenAI API 연동' },
  { name: 'UX라이팅 플러그인', version: 'v1.8', url: 'https://euuezone.github.io/shinhan-uxwriting-plugin/01_사용가이드/plugin-guide_v2.html', desc: '피그마 작업 중 UX라이팅 가이드 준수 여부를 실시간으로 확인하는 피그마 플러그인' },
  { name: 'UX라이팅 신고 대시보드', version: 'v1.8', url: 'https://euuezone.github.io/shinhan-uxwriting-plugin/03_대시보드/', desc: '프로젝트 전체 화면의 UX라이팅 가이드 위반 현황을 한눈에 확인하는 웹 대시보드' },
  { name: 'QA AI 도우미', version: 'v1', url: 'https://euuezone.github.io/qa-ai-figma-plugin/', desc: '화면 컴포넌트를 선택하면 TC를 자동으로 작성해주는 AI 기반 피그마 플러그인' },
  { name: '문서 마스터 템플릿', version: 'v14', url: 'https://euuezone.github.io/document-master-template/', desc: 'AI Native SDLC 도입 제안을 위해 만든 기획 문서 HTML 템플릿' },
  { name: 'Korean Design MD', version: 'v1', url: 'https://euuezone.github.io/korean-design-md/', desc: '국내 73개 서비스의 디자인 패턴과 인터랙션 레퍼런스를 정리한 문서' },
  { name: 'AI 디자인 프롬프트', version: 'v1', url: 'https://euuezone.github.io/ai-design-prompt/', desc: 'AI 이미지 생성에 쓰는 프롬프트를 카테고리별로 관리하는 도구' },
  { name: 'megaflow', version: 'v3', url: 'https://research-mindmap.vercel.app', desc: '문서 유형 선택 → PRD → 목차 편집 → 섹션별 마인드맵 → 최종 문서까지 5단계로 이어지는 리서치&문서 자동 생성 서비스' },
];

// ── State ─────────────────────────────────────────────────────────────────────
const CATEGORIES = ['전체', '프로젝트소개', '삽질기', '해결기', '발견', '작업일지'];
let activeFilter = '전체';

// ── Render ────────────────────────────────────────────────────────────────────
async function init() {
  const checks = [
    { name: '문서 마스터 템플릿',  repo: 'euuezone/document-master-template',   path: '',              pattern: /_v(\d+)\.html$/,              base: 'https://euuezone.github.io/document-master-template/' },
    { name: 'UX라이팅 플러그인',   repo: 'euuezone/shinhan-uxwriting-plugin',   path: '01_사용가이드',  pattern: /plugin-guide_v(\d+)\.html$/,  base: 'https://euuezone.github.io/shinhan-uxwriting-plugin/01_사용가이드/' },
    { name: 'QA AI 도우미',        repo: 'euuezone/qa-ai-figma-plugin',         path: '',              pattern: /ui_v(\d+)\.html$/,            base: null },
    { name: 'Korean Design MD',    repo: 'euuezone/korean-design-md',           path: '',              pattern: /Korean_Design_MD_v(\d+)\.html$/, base: 'https://euuezone.github.io/korean-design-md/' },
    { name: 'AI 디자인 프롬프트',  repo: 'euuezone/ai-design-prompt',           path: '',              pattern: /prompt-manager_v(\d+)\.html$/, base: 'https://euuezone.github.io/ai-design-prompt/' },
  ];
  await Promise.all(checks.map(async ({ name, repo, path, pattern, base }) => {
    try {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${path ? encodeURIComponent(path) : ''}`;
      const files = await (await fetch(apiUrl)).json();
      const matched = files.filter(f => f.name.endsWith('.html') && pattern.test(f.name));
      if (!matched.length) return;
      matched.sort((a, b) => parseInt(b.name.match(pattern)[1]) - parseInt(a.name.match(pattern)[1]));
      const latest = matched[0];
      const proj = PROJECTS.find(p => p.name === name);
      if (!proj) return;
      proj.version = 'v' + latest.name.match(pattern)[1];
      if (base) proj.url = base + latest.name;
    } catch (e) {}
  }));
  renderProjects();
  renderFilters();
  renderPosts();
}

function renderProjects() {
  document.getElementById('projectsList').innerHTML = PROJECTS.map((p, i) =>
    `<div class="project-card">
      <a href="${p.url}" target="_blank" style="text-decoration:none;color:inherit;">
        <div class="project-card-head">
          <span class="pill-dot"></span>
          <span class="project-card-name">${p.name}</span>
          <span class="project-card-ver">${p.version}</span>
        </div>
        <div class="project-card-desc">${p.desc}</div>
      </a>
      ${p.guide ? `<button class="project-card-guide" onclick="openGuide(${i})">📖 사용법 · 다운로드</button>` : ''}
    </div>`
  ).join('');
}

function openGuide(idx) {
  const p = PROJECTS[idx];
  document.getElementById('modalInner').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <span class="pill-dot" style="width:8px;height:8px;"></span>
      <span style="font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0.05em;text-transform:uppercase;">${p.name}</span>
      <span style="font-size:12px;color:var(--sub);">${p.version}</span>
    </div>
    <div class="modal-body">${p.guide.content}</div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderFilters() {
  document.getElementById('filters').innerHTML = CATEGORIES.map(c =>
    `<button class="filter-btn ${c === activeFilter ? 'on' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.cat;
      renderFilters();
      renderPosts();
    });
  });
}

function renderPosts() {
  const posts = activeFilter === '전체'
    ? BLOG_DATA.posts
    : BLOG_DATA.posts.filter(p => p.category === activeFilter);

  const sorted = [...posts].sort((a, b) => b.date.localeCompare(a.date));
  const total = BLOG_DATA.posts.length;
  document.getElementById('postCount').textContent = `${total}개`;

  if (!sorted.length) {
    document.getElementById('postsGrid').innerHTML =
      `<div class="empty"><div class="empty-icon">📝</div><p>아직 기록이 없습니다.</p></div>`;
    return;
  }

  document.getElementById('postsGrid').innerHTML = sorted.map(post => {
    const idx = BLOG_DATA.posts.indexOf(post);
    return `
    <div class="post-card" onclick="openModal(${idx})">
      <button class="card-share" onclick="event.stopPropagation(); sharePost('${post.id}')" title="링크 복사">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </button>
      <div class="card-top">
        <span class="category-badge cat-${post.category}">${post.category}</span>
        <span class="card-date">${post.date}</span>
      </div>
      <div class="card-title">${post.title}</div>
      <div class="card-summary">${post.summary}</div>
      <div class="card-tags">
        ${(post.tags || []).map(t => `<span class="card-tag">#${t}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(idx) {
  const p = BLOG_DATA.posts[idx];
  history.replaceState(null, '', '#' + p.id);
  document.getElementById('modalInner').innerHTML = `
    <button class="modal-share" onclick="sharePost('${p.id}')" title="링크 복사">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
    </button>
    <span class="modal-badge cat-${p.category}">${p.category}</span>
    <h2 class="modal-title">${p.title}</h2>
    <div class="modal-meta">
      <span>${p.date}</span>
      <span class="meta-dot">·</span>
      <span>${p.project || ''}</span>
      ${(p.tags || []).map(t => `<span class="meta-tag">#${t}</span>`).join('')}
    </div>
    <div class="modal-body">${p.content || `<p>${p.summary}</p>`}</div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  history.replaceState(null, '', location.pathname);
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Share ─────────────────────────────────────────────────────────────────────
function sharePost(id) {
  const url = location.origin + location.pathname + '#' + id;
  navigator.clipboard.writeText(url).then(() => showToast('링크가 복사됐습니다 ✓'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Hash routing (직접 링크로 접근 시) ─────────────────────────────────────────
function checkHash() {
  const hash = location.hash.slice(1);
  if (hash) {
    const idx = BLOG_DATA.posts.findIndex(p => p.id === hash);
    if (idx !== -1) openModal(idx);
  }
}

init();
checkHash();
</script>
</body>
</html>
